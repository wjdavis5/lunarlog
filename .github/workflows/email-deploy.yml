name: Email worker deploy (Cloudflare Workers)

# Issue #1107: inbound email receiving and processing worker on lunarlog.app.
# Deploys workers/email/ to Cloudflare Workers with custom domain route email.lunarlog.app.

on:
  push:
    branches: [main]
    paths:
      - 'workers/email/**'
      - '.github/workflows/email-deploy.yml'
  workflow_dispatch:

concurrency:
  group: email-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy inbound email Worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Cloudflare credentials and KV configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; skipping the Cloudflare Worker deploy."
            exit 0
          fi
          if grep -q "placeholder_inbound_emails_kv" workers/email/wrangler.jsonc; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::workers/email/wrangler.jsonc contains placeholder KV namespace id (placeholder_inbound_emails_kv); skipping deploy until real KV namespace is provisioned (see docs/ops/inbound-email.md §2A)."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: workers/email
        run: npm ci

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Issue #1121: pinned to 4.20.0 matching links-deploy.yml (#1090)
          wranglerVersion: '4.20.0'
          workingDirectory: 'workers/email'
          command: deploy --config wrangler.jsonc
