name: Supabase migrate

# Pushes the tracked migrations under supabase/migrations to the cloud
# project (KTD14), then deploys the Edge Functions that are live in
# production -- feedback-notify, feedback-reply, push-dispatch (Issue #5),
# and delete-account (Issue #17 U2/U7). Runs only when supabase/** changes
# on main, inside the `production` GitHub environment, which must be
# configured with a required reviewer and the environment-scoped secrets
# SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF, the
# four Apple secrets the delete-account function needs at runtime
# (APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_CLIENT_ID, APPLE_PRIVATE_KEY), and the
# four push-dispatch secrets (FCM_PROJECT_ID, FCM_CLIENT_EMAIL,
# FCM_PRIVATE_KEY, PUSH_DISPATCH_WEBHOOK_SECRET) -- see AGENTS.md's "Config
# & Credential Locations".
#
# The Apple-secret and push-dispatch-secret checks are each scoped to their
# own function's secret-set step only, not to the whole job: an unrelated
# supabase/** push (a new migration, another function) must not fail purely
# because a signing key or FCM service-account value hasn't been
# provisioned yet -- migrations still get pushed and every function still
# gets its code deployed either way. The Apple check hard-fails just the
# delete-account secret-set/deploy steps (that function cannot revoke an
# Apple identity without them -- Issue #17 KTD3). The push-dispatch check is
# softer: it warns and skips only the `supabase secrets set` step, because
# push-dispatch is already live in production with secrets set out-of-band
# (issue #163 / D-19), so a CI run without those secrets configured yet
# should not be treated as a deploy failure.
#
# The "Reconcile Realtime publication" step re-invokes
# public.reconcile_realtime_publication() after every push (Issue #77 / PR
# #92 review). `db push` only applies migrations not yet recorded as applied
# on the target project, so the drift guard baked into
# supabase/migrations/20260905100000_realtime_publication.sql only runs
# automatically on a from-scratch environment -- it does NOT re-run just
# because `db push` ran again. This step is what makes the guard actually
# fire on every ordinary deploy, catching a Supabase Studio "Enable
# Realtime" toggle used against an already-migrated project. It is
# idempotent and safe to run even when that migration was not part of this
# push, and runs before the Apple-secret check so it is never skipped by a
# missing Apple key. There is still no *periodic* reconciliation between
# deploys -- see the tracked follow-up in AGENTS.md's Migration Flow
# section.
#
# The "Check for schema drift" step (issue #163 / D-19, D-21) runs
# `supabase db diff --linked --schema public` and fails the job on any
# non-empty output -- this is what would have caught an out-of-band Studio
# change (or a migration applied outside this workflow) before it went
# unnoticed. The "Database advisor gate" step (also issue #163) runs
# `supabase db advisors --linked --type security --fail-on error`, a
# CI-enforced replacement for the old manual "check the Supabase MCP
# get_advisors output before approving" step -- the CLI has had a `db
# advisors` subcommand since at least 2.116.0 (confirmed via `supabase db
# --help`/`supabase db advisors --help` against the pinned version below),
# so the MCP-only caveat that used to live in this comment no longer
# applies. Both gates run LAST, after every other step in this job
# (db push, the Realtime reconcile, both Edge Function deploys, and the
# push-dispatch / Apple secret checks) -- issue #163 review: they can only
# report on what's already live, they can never prevent it, so placing them
# before the function deploys would let a false-positive drift or advisor
# finding block an unrelated function deploy instead of just flagging it
# after the fact. The advisor gate is pinned to --fail-on error rather than
# warn because production currently carries tracked warn-level findings --
# anon-executable SECURITY DEFINER functions (issue #158, in flight),
# search_path and extension-in-public lints (issue #194), and the
# dashboard-only leaked-password-protection setting -- and --fail-on warn
# would fail every run until all three land. TODO(#163 follow-up): tighten
# to --fail-on warn once #158, #194, and leaked-password protection are
# done.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch:

concurrency:
  # Migrations must apply in order; never cancel one mid-push.
  group: supabase-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
      FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
      PUSH_DISPATCH_WEBHOOK_SECRET: ${{ secrets.PUSH_DISPATCH_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version the migrations and tests were written against.
          version: 2.116.0

      - name: Check deploy credentials
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create a Supabase personal access token (supabase.com dashboard -> Account -> Access Tokens) and add it as a \`production\` environment secret named SUPABASE_ACCESS_TOKEN (repository Settings -> Environments -> production -> Environment secrets), then re-run this workflow."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set on the \`production\` environment. Add it (Environment secrets) and re-run."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set on the \`production\` environment. Add it (Environment secrets) and re-run."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: List pending migrations
        run: supabase db push --dry-run

      - name: Push migrations
        run: supabase db push

      - name: Reconcile Realtime publication
        # Explicitly re-runs the drift guard after every push (see the
        # header comment above and AGENTS.md's Migration Flow) -- `db push`
        # alone does not, because it only applies migrations not yet marked
        # applied on the target project. Safe to run unconditionally: the
        # function is idempotent and a no-op when nothing has drifted. Runs
        # before the Apple-secret check below so it is never skipped by a
        # missing Apple key.
        run: |
          supabase db query --linked \
            "select public.reconcile_realtime_publication();"

      - name: Deploy Edge Functions
        # supabase/** already covers supabase/functions/, so no trigger-path
        # change is needed for this step (Issue #6, U9). push-dispatch
        # (Issue #5) added here per issue #163 -- it was live in production
        # at v4 but missing from this deploy step entirely.
        run: supabase functions deploy feedback-notify feedback-reply push-dispatch --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Check push-dispatch secrets
        id: push_dispatch_secrets
        # Softer than the Apple check below: push-dispatch is already live
        # in production with its FCM_*/PUSH_DISPATCH_WEBHOOK_SECRET values
        # set out-of-band, so a run where these GitHub secrets are not
        # (yet) configured should warn and skip the secrets-set step below,
        # not fail the whole deploy -- the function code above still
        # deploys either way.
        run: |
          if [ -z "${FCM_PROJECT_ID:-}" ] || [ -z "${FCM_CLIENT_EMAIL:-}" ] || [ -z "${FCM_PRIVATE_KEY:-}" ] || [ -z "${PUSH_DISPATCH_WEBHOOK_SECRET:-}" ]; then
            echo "::warning::One or more push-dispatch secrets (FCM_PROJECT_ID, FCM_CLIENT_EMAIL, FCM_PRIVATE_KEY, PUSH_DISPATCH_WEBHOOK_SECRET) are not set on the \`production\` environment. push-dispatch's code was still deployed above, but this run did not update its runtime secrets on the project (they are presumed already set out-of-band). See AGENTS.md's 'Config & Credential Locations' for where each value comes from; add them as \`production\` environment secrets to have CI manage them going forward."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set push-dispatch function secrets
        if: steps.push_dispatch_secrets.outputs.configured == 'true'
        run: |
          supabase secrets set \
            FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            FCM_CLIENT_EMAIL="$FCM_CLIENT_EMAIL" \
            FCM_PRIVATE_KEY="$FCM_PRIVATE_KEY" \
            PUSH_DISPATCH_WEBHOOK_SECRET="$PUSH_DISPATCH_WEBHOOK_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Check Apple secrets (account-deletion deploy only)
        run: |
          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_KEY_ID:-}" ] || [ -z "${APPLE_CLIENT_ID:-}" ] || [ -z "${APPLE_PRIVATE_KEY:-}" ]; then
            echo "::error::One or more Apple secrets (APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_CLIENT_ID, APPLE_PRIVATE_KEY) are not set on the \`production\` environment. The delete-account function needs all four to revoke an Apple identity on deletion (Issue #17 KTD3) - add them (Environment secrets) and re-run. See AGENTS.md's 'Config & Credential Locations' for where each value comes from. This only blocks deploying delete-account - migrations for unrelated supabase/** changes already pushed successfully above."
            exit 1
          fi

      - name: Set delete-account function secrets
        run: |
          supabase secrets set \
            APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            APPLE_KEY_ID="$APPLE_KEY_ID" \
            APPLE_CLIENT_ID="$APPLE_CLIENT_ID" \
            APPLE_PRIVATE_KEY="$APPLE_PRIVATE_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy delete-account function
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Check for schema drift
        # Issue #163 / D-19: catches a schema change made out-of-band (a
        # Studio edit, a manual `psql`, or a migration applied outside this
        # workflow) that supabase/migrations does not account for. `db diff`
        # itself does not set a non-zero exit code on a non-empty diff, so
        # this step captures the output and fails explicitly. Runs last,
        # after every deploy step above (issue #163 review): a false
        # positive here can only report on an already-completed deploy, it
        # can never block one -- putting it earlier would risk failing an
        # unrelated function deploy over a drift finding that has nothing
        # to do with it.
        run: |
          diff_output="$(supabase db diff --linked --schema public)"
          if [ -n "$diff_output" ]; then
            echo "::error::supabase db diff --linked --schema public found a non-empty diff between supabase/migrations and the linked project's public schema. This means something changed the live schema outside of a tracked migration file (a Studio edit, a manual psql session, or an out-of-band db push). Add a migration under supabase/migrations that captures the drift, or if the drift itself is a mistake, revert it on the project directly, then re-run this workflow."
            echo "$diff_output"
            exit 1
          fi
          echo "No schema drift detected between supabase/migrations and the linked project's public schema."

      - name: Database advisor gate
        # Issue #163 / D-19: a CI-enforced replacement for the old "check
        # the Supabase MCP get_advisors output before approving" manual
        # step. Fails the job on any security-severity finding at error
        # level (info-level lints are advisory noise, not a gate); narrowed
        # to --type security because performance lints (e.g. an unindexed
        # foreign key) are not a deploy blocker here. Pinned to --fail-on
        # error rather than warn: production currently carries tracked
        # warn-level findings -- anon-executable SECURITY DEFINER functions
        # (issue #158, in flight), search_path and extension-in-public
        # lints (issue #194), and the dashboard-only
        # leaked-password-protection setting -- so --fail-on warn would fail
        # every run until all three land. Runs last, after every deploy
        # step above, for the same reason as the schema-drift check right
        # before it: both gates can only report on what's already live,
        # never prevent it, so placing them before the function deploys
        # would turn a false positive into a blocked function deploy.
        # TODO(#163 follow-up): tighten to --fail-on warn once #158, #194,
        # and leaked-password protection are done.
        run: supabase db advisors --linked --type security --fail-on error --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
