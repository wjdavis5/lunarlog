name: CI

# Validation for pushes to main and pull requests. There is no release
# pipeline yet, so this workflow is the only consumer of runner minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_CHANNEL: stable

concurrency:
  # Supersede in-flight checks when a branch is pushed to again.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-guards:
    # Proves the release-guard scripts (issue #41) on every PR instead of
    # by pushing to main. No Flutter, Java, or Supabase toolchain and no
    # secrets, so this stays fast.
    name: Release guard scripts (unit tests + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Each verification step below runs with `if: always()` (skipping only
      # on cancellation) so one script's failure can never hide the rest --
      # that was the P1 bug: a single red step used to short-circuit every
      # step after it, leaving the release gate with zero executed coverage
      # in CI. Every step's own pass/fail is now always visible.
      - name: Run extract-marketing-version tests
        if: always()
        run: bash .github/scripts/tests/extract-marketing-version.test.sh

      - name: Run detect-version-bump tests
        if: always()
        run: bash .github/scripts/tests/detect-version-bump.test.sh

      - name: Run check-release-gate tests
        if: always()
        run: bash .github/scripts/tests/check-release-gate.test.sh

      - name: Cache actionlint
        id: actionlint-cache
        if: always()
        uses: actions/cache@v4
        with:
          path: actionlint
          key: actionlint-${{ runner.os }}-1.7.7

      - name: Install actionlint
        if: always() && steps.actionlint-cache.outputs.cache-hit != 'true'
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          set -euo pipefail
          curl -sSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          rm actionlint.tar.gz

      - name: Verify actionlint
        if: always()
        run: ./actionlint -version

      - name: Lint workflows with actionlint
        if: always()
        run: ./actionlint .github/workflows/*.yml

  release-guards-macos:
    # The guard scripts actually execute on ios-release.yml's macos-latest
    # runner, which ships a frozen Bash 3.2 (no bash-4+ syntax) -- a real
    # bash-4-only construct (${var,,}) slipped into check-release-gate.sh
    # during this same branch's development and would have crashed the
    # TestFlight pipeline silently, since the ubuntu-only release-guards job
    # above cannot see a macOS-only shell incompatibility. Same three test
    # scripts, no actionlint (that check is OS-independent).
    name: Release guard scripts on macOS (bash 3.2 compatibility)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Same rationale as the release-guards job above: keep every script's
      # result visible instead of letting an earlier failure hide the rest.
      - name: Run extract-marketing-version tests
        if: always()
        run: bash .github/scripts/tests/extract-marketing-version.test.sh

      - name: Run detect-version-bump tests
        if: always()
        run: bash .github/scripts/tests/detect-version-bump.test.sh

      - name: Run check-release-gate tests
        if: always()
        run: bash .github/scripts/tests/check-release-gate.test.sh

  check:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Quality gates (coverage floor + CRAP)
        # Re-runs with --coverage (the plain Test step above stays a fast
        # flutter-test-only signal per R11): 90% total line coverage floor
        # and the per-method CRAP gate, both from one filtered lcov.info.
        # See tool/quality_gate.dart and AGENTS.md "Quality gates".
        run: dart run tool/quality_gate.dart

      - name: Build web (release)
        # The defines resolve to empty strings on forks and PRs without
        # secrets; the app treats empty as "unconfigured", so the build
        # must succeed either way. LUNARLOG_WEB_SYNC is never set in CI.
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

  db-tests:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version the migrations and tests were written against.
          version: 2.116.0

      - name: Start local Supabase (database-only services)
        # pgTAP only needs Postgres; skip the services that would otherwise
        # pull images and consume runner time. Migrations are applied on start.
        run: |
          supabase start \
            -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP tests
        # Proves RLS isolation, privileges, constraints, and sync_push (R9).
        run: supabase test db --local

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  android:
    name: Build Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            ios/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        # Unsigned: a PR from a fork cannot read signing secrets, and this
        # only needs to prove the app still compiles for a device.
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
