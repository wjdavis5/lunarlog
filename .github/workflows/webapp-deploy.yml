name: Web app staging deploy (Cloudflare Workers)

# Epic #831 / issue #1249: the React web client's staging deploy path. Builds
# `webapp/` (Vite + React + TypeScript strict) and deploys it to the
# `lunarlog-app-staging` Cloudflare Worker — staging ONLY: the origin is the
# Worker's workers.dev hostname, backed by the production Supabase project
# and used only with the fabricated accounts from #710. Moving
# `app.lunarlog.app` over is #1258; this workflow deliberately declares no
# custom domain.
#
# Mirrors site-deploy.yml's credential-gated posture: until the Cloudflare
# secrets exist, the credential-gated steps (deploy, smoke check) warn and
# are skipped; the run still succeeds and the verified build is uploaded as
# an artifact.
#
# The smoke check after the deploy is `.github/scripts/check-webapp-staging.sh`
# (the repurposed check-web-deploy.sh header/beacon assertions, issue #1092 →
# #1249), run against the live workers.dev origin — the only place a declared
# header the origin never serves is visible.

env:
  # The same pinned SDK every other workflow builds with (the AGENTS.md
  # SDK-bump procedure lists the workflows that carry this pin).
  FLUTTER_VERSION: '3.47.2'

on:
  push:
    branches: [main]
    # The same path set the webapp CI job filters on (issue #1249): the
    # client, its schema snapshot, its message source — plus this workflow
    # and the smoke check it runs.
    paths:
      - 'webapp/**'
      - 'supabase/database.types.ts'
      - 'lib/l10n/app_en.arb'
      # The Dart domain the client compiles to JavaScript (issue #1251): a
      # domain change rebuilds the module and redeploys staging with it.
      - 'lib/domain/**'
      - 'tool/web_domain/**'
      - '.github/workflows/webapp-deploy.yml'
      - '.github/scripts/check-webapp-staging.sh'
  workflow_dispatch:

# Supersede a queued run when main is pushed to again, but never cancel one
# mid-deploy: an interrupted upload would leave staging serving a partial or
# older release.
concurrency:
  group: webapp-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy the webapp staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned the way site/ pins it (site-deploy.yml): the major, so a
          # runner-image change cannot move the toolchain.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      # The compiled Dart domain module (issue #1251) — staging must serve
      # the same artifact CI's webapp job parity-tested, so the deploy
      # builds it exactly the same way. The Flutter SDK is required to
      # resolve the root package's pubspec; `dart compile js` is plain
      # dart2js (same script output, same CSP cleanliness).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Compile the Dart domain module (dart2js)
        run: |
          flutter pub get
          dart compile js -O2 --no-source-maps tool/web_domain/main.dart \
            -o webapp/public/domain/lunarlog_domain.js
          rm -f webapp/public/domain/lunarlog_domain.js.deps

      # The client-safe Supabase pair — the project URL and publishable key,
      # the same values the Flutter builds receive (kept under their old
      # repository-secret names). They resolve to empty strings on forks;
      # the app treats empty as "unconfigured", so the build must succeed
      # either way. No other define exists on web yet.
      - name: Build the web app
        working-directory: webapp
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Upload the verified build as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webapp-dist
          path: webapp/dist
          retention-days: 7

      - name: Check the Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; skipping the webapp staging deploy."
          fi

      - name: Resolve the staging workers.dev hostname
        # The workers.dev origin carries a per-account subdomain the repo
        # cannot know (webapp/wrangler.jsonc declares `workers_dev: true` and
        # no route). Read it from the Cloudflare API so the smoke check below
        # tests the real origin. A failure here skips only the smoke check —
        # the deploy itself already succeeded.
        if: steps.cloudflare.outputs.configured == 'true'
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if subdomain="$(curl -sS --fail --max-time 20 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | jq -r '.result.subdomain // empty')" && [ -n "$subdomain" ]; then
            echo "base_url=https://lunarlog-app-staging.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not resolve the account's workers.dev subdomain; skipping the staging smoke check."
          fi

      - name: Retire the Flutter Pages project that holds app.lunarlog.app
        # Issue #1248/#1258: the custom-domain attach in the deploy below
        # fails while the retired Flutter build's Cloudflare Pages project
        # still owns the hostname, so delete it first — idempotent (a
        # not-found project means a previous run already retired it). If the
        # token lacks Pages permissions the deploy's domain attach fails
        # loudly, which is #1093 step 4's one-dashboard-click fallback.
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          npx wrangler@4.20.0 pages project delete lunarlog-app --yes \
            || echo "::warning::Could not delete the lunarlog-app Pages project (already retired, or the token lacks Pages permissions). If it still holds app.lunarlog.app, the deploy's custom-domain attach below will fail — the manual fallback is the Cloudflare dashboard's Pages custom-domains pane (#1093 step 4)."
          # Give the hostname release a moment so the attach does not race
          # the deletion.
          sleep 20

      - name: Deploy to Cloudflare Workers (staging + app.lunarlog.app)
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Same pin as site-deploy.yml (see its comment: 4.20.0 is the
          # lowest 4.x that accepts the array form of run_worker_first and
          # handles the asset directives).
          wranglerVersion: '4.20.0'
          workingDirectory: 'webapp'
          command: deploy --config wrangler.jsonc

      - name: Set the auth Worker's publishable key secret
        # Issue #1250: worker/auth.ts reads SUPABASE_PUBLISHABLE_KEY at
        # runtime (its one upstream credential, client-safe, the same value
        # the client build receives under the secret's kept old name). Set
        # after the deploy so a first run has a Worker to attach the secret
        # to. Warn-and-skip when absent (forks): the auth routes then answer
        # 503 auth_not_configured while the static shell still serves.
        if: steps.cloudflare.outputs.configured == 'true'
        working-directory: webapp
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_ANON_KEY is not configured; skipping the auth Worker secret (auth routes will answer 503 auth_not_configured)."
            exit 0
          fi
          printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | npx wrangler@4.20.0 secret put SUPABASE_PUBLISHABLE_KEY --config wrangler.jsonc

      - name: Smoke-check the staging origin
        # The repurposed check-web-deploy.sh assertions (issue #1249): the
        # live origin must serve the declared security headers, the real
        # shell, and the /auth/* SPA fallback. Retries for ~90 s to allow
        # for edge propagation.
        if: steps.cloudflare.outputs.configured == 'true' && steps.subdomain.outputs.base_url != ''
        env:
          WEBAPP_STAGING_BASE_URL: ${{ steps.subdomain.outputs.base_url }}
        run: bash .github/scripts/check-webapp-staging.sh

      - name: Smoke-check the production origin (app.lunarlog.app)
        # Issue #1258: the same assertions against the cutover domain, plus
        # the #1248 retirement duties — /privacy.html's 301 to the apex
        # policy and the self-unregistering flutter_service_worker.js.
        # Skipped on runs without credentials (forks) by the outer
        # condition; a failed attach in the deploy step fails the run before
        # this can assert against a domain the Worker does not hold.
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          WEBAPP_STAGING_BASE_URL: https://app.lunarlog.app
          WEBAPP_CHECK_RETIREMENT: '1'
        run: bash .github/scripts/check-webapp-staging.sh
