name: Site (marketing site)

# Issue #1099: CI for the Astro marketing site in `site/`. This is a
# separate, path-filtered workflow on purpose:
#   - an app PR runs no site jobs (acceptance criterion 2) — with the
#     issue #1104 exception the path filter below carries: a PR touching
#     `lib/ui/**` or `tool/screenshots/**` CAN change what the site shows
#     (the screenshots are rendered from the real UI), so it runs these
#     checks too;
#   - it is NOT in ci.yml's `detect-changes` outputs or its "CI required
#     checks" aggregate, so a site failure can never gate an app release.
#
# Issue #1105: the home and feature pages embed the #1104 screenshots, and
# check:links fails on a referenced file missing from dist/ — so this job
# renders the screenshots (same step as site-deploy.yml's, same pinned SDK)
# before building, instead of leaving that to the deploy alone.
#
# Deploying is `site-deploy.yml`; this workflow only verifies.

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'PRIVACY.md'
      - 'lib/domain/content/**'
      - 'lib/l10n/app_en.arb'
      # Issue #1104: the site's screenshots are rendered from the app's UI
      # (tool/screenshots/), so a UI change can change what the site shows
      # — UI PRs run the site checks, and site-deploy.yml regenerates the
      # screenshots on the merge.
      - 'lib/ui/**'
      - 'tool/screenshots/**'
      # Issue #1431: the home page's browser figure is the React web
      # client's own capture (webapp/e2e/browser-home-capture.spec.ts), so
      # a webapp change can change what the site shows exactly the way a
      # lib/ui change can — the same #1104 logic, one directory over.
      - 'webapp/**'
      - '.github/workflows/site.yml'
  schedule:
    # Mondays 06:23 UTC. The weekly outbound-link check (issue #1099) is a
    # no-op until issue #1104 adds the external medical sources.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Site build, links, Lighthouse, axe
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # #1105 added the Flutter screenshot render; Lighthouse runs 3x over
    # ten URLs now; issue #1431 adds the web client's Playwright capture
    # (webapp npm ci + build + Chromium) after the Flutter renders. 35
    # minutes had no headroom for the added minutes.
    timeout-minutes: 45
    # Issue #1316: the SDK pin rides the same FLUTTER_VERSION env var every
    # other Flutter workflow uses, not a step-level literal — a literal is
    # invisible to .github/scripts/check-flutter-version-parity.sh and to
    # AGENTS.md's grep -rl FLUTTER_VERSION enumeration, so the next SDK
    # bump would leave these screenshots rendering on a stale engine while
    # the parity gate stayed green. Same job-level shape as site-deploy.yml.
    env:
      # Pinned to the same SDK every other workflow builds with (see
      # FLUTTER_VERSION in ci.yml) so the screenshots render with the
      # exact engine the app ships on.
      FLUTTER_VERSION: '3.47.2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The Node version is pinned in one place, site/.nvmrc (issue
          # #1602). It is 24 for its npm, not for Node: the lockfile is
          # written by npm 11, by the dependency bot as much as by
          # anyone here, and npm 10 (Node 22) refuses a lockfile npm 11
          # has regenerated ("Missing: proxy-agent from lock file"),
          # which is how a security update sat unmergeable (#1593).
          # Astro 7 needs Node >= 22.12 either way. Issue #1431: the
          # webapp lockfile is cached too — the browser capture below
          # installs webapp/ to run its Playwright spec.
          node-version-file: 'site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            site/package-lock.json
            webapp/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      # Issue #1105: the home and feature pages embed the #1104 app
      # screenshots, and check:links fails when a referenced file is
      # missing from dist/ — so the PR job renders them before the build,
      # exactly as site-deploy.yml does (same pinned SDK, same command,
      # same gitignored output directory).
      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the app screenshots
        working-directory: site
        run: |
          # The runner's cached SDK (flutter-action cache: true) can carry
          # material_fonts.stamp without a usable artifact — CI runs on this
          # branch saw precache consider it fresh while the render harness
          # failed with "Material Icons font not found". Drop the stamp and
          # --force the re-download; the ls lines leave ground truth in the
          # log if it ever breaks differently.
          rm -f "$FLUTTER_ROOT/bin/cache/material_fonts.stamp"
          ls -la "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/" 2>/dev/null || echo "material_fonts missing before precache"
          flutter precache --universal --force
          ls -la "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/"
          flutter pub get
          npm run screenshots

      # Issue #1431: the home page's browser figure is the React web
      # client's own signed-in home — the Flutter harness cannot draw it
      # (its browser class stopped being rendered here in the same change;
      # tool/screenshots/manifest.dart's kFlutterRenderedDevices). The
      # capture runs after the Flutter renders and before the site build,
      # writing into the same gitignored site/public/screenshots/ the
      # build copies into dist/ — check:links fails the job if the PNG the
      # home page references never appeared.
      - name: Compile the browser version's domain module
        # The today-log card the figure shows is computed by the compiled
        # Dart domain module (issue #1251) — the same dart2js artifact the
        # webapp CI job builds, same command.
        run: |
          flutter pub get
          dart compile js -O2 --no-source-maps tool/web_domain/main.dart \
            -o webapp/public/domain/lunarlog_domain.js
          rm -f webapp/public/domain/lunarlog_domain.js.deps

      - name: Install the web app's dependencies and Playwright Chromium
        working-directory: webapp
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the browser version
        # The client-safe Supabase pair, quoted for the same reason the
        # webapp CI job quotes them: empty on forks and Dependabot, and
        # the capture below then skips on an unconfigured build (issue #1655).
        working-directory: webapp
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Capture the browser version's home screenshot
        working-directory: webapp
        env:
          LUNARLOG_BROWSER_CAPTURE_OUT: ${{ github.workspace }}/site/public/screenshots
        run: npx playwright test e2e/browser-home-capture.spec.ts

      - name: Build and type-check the site
        # `npm run build` runs `astro sync`, `astro check`, and the static
        # build. On an unconfigured build (forks and Dependabot) the capture
        # skipped and today-browser-light.png was not written, so building
        # with LUNARLOG_WEB_APP_LIVE=false drops the browser figure so
        # check:links does not fail on the missing figure (issue #1655).
        working-directory: site
        env:
          LUNARLOG_WEB_APP_LIVE: ${{ secrets.SUPABASE_URL != '' && 'true' || 'false' }}
        run: npm run build

      - name: Verify the public/ files were copied verbatim
        # site/public/ is copied into dist/ by the build; the AASA, the invite
        # page, and the strict `_headers` file must survive unchanged (the
        # AASA/invite content is also pinned by
        # test/domain/sharing/link_artifacts_test.dart).
        working-directory: site
        run: |
          cmp dist/.well-known/apple-app-site-association public/.well-known/apple-app-site-association
          cmp dist/invite.html public/invite.html
          cmp dist/_headers public/_headers

      - name: Validate the built HTML
        working-directory: site
        run: npm run check:html

      - name: Check internal links and off-origin resources
        # Fails on a broken same-origin reference and on any resource loaded
        # from a non-lunarlog.app origin (acceptance criteria 3 and 4).
        working-directory: site
        run: npm run check:links

      - name: Check that no word touches an inline link
        # A link that starts its own source line used to lose the space
        # before it in the build ("sees whattheir role allows"). Fails if
        # any built page has a word glued to a link or other inline
        # element; astro.config.mjs explains the cause.
        working-directory: site
        run: npm run check:spacing

      - name: Check the privacy page section anchors
        # Issue #1101: /privacy's section anchors are the deep-link contract
        # for the in-app privacy dialog. A silent PRIVACY.md heading rename
        # fails here instead of breaking those links quietly.
        working-directory: site
        run: npm run check:privacy-anchors

      - name: Check the guides' claims ledger
        # Issue #1106: every factual claim in a how-to guide cites the repo
        # path (or issue) that ships it; a cited path that no longer exists
        # fails here, so a move or rename cannot strand a guide's evidence.
        working-directory: site
        run: npm run check:claims

      - name: Run the site unit tests
        # Issue #1106: node --test over site/scripts/*.test.mjs — the ARB
        # loader's build-fails-on-unknown-key rules and the claims-check
        # functions, which do not need a browser to prove.
        working-directory: site
        run: npm test

      - name: Run axe against the built site
        working-directory: site
        run: npm run check:axe

      - name: Run the Lighthouse CI budgets
        # Accessibility must be 100; performance and best-practices >= 95
        # (site/lighthouserc.cjs). Fails the job when a budget is missed.
        working-directory: site
        run: npm run check:lighthouse

      - name: Build and check the site as it is when the browser version is down
        # The deploy builds the site with LUNARLOG_WEB_APP_LIVE=false when
        # app.lunarlog.app is not serving the browser version
        # (site/src/lib/web-app.mjs). That build would otherwise only ever
        # happen during an outage. Here it is built on every site change and
        # checked: no page links to the address, the home page says so in
        # place of its button, and the result is still valid HTML. It runs
        # last because it replaces site/dist.
        working-directory: site
        env:
          LUNARLOG_WEB_APP_LIVE: 'false'
        run: |
          npm run build
          node scripts/check-web-app-down.mjs
          npm run check:html
          npm run check:spacing

      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-report
          path: site/.lighthouseci
          retention-days: 7

  external-links:
    name: Weekly external link check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # One pin for every site job: see the build job above.
          node-version-file: 'site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Check every outbound link
        id: external
        working-directory: site
        run: npm run check:external-links

      - name: File or refresh the rolling issue
        # The #707 pattern: one issue that is refreshed on each failing run,
        # never one per run. Only reached on a scheduled failure.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Site: weekly external link check is failing"
          existing="$(gh issue list --state open --search 'in:title weekly external link check is failing' --json number --jq '.[0].number')"
          body="The weekly external link check in \`site.yml\` failed.

          Run: $RUN_URL

          Fix the outbound link(s) named in the run log. This issue is refreshed by the next failing run; close it once the links pass."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
