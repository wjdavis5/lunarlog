name: CI failure watch

# Files or updates one prioritized issue whenever a watched workflow fails on
# `main`, so a red main -- or a silently-broken release/ops pipeline -- is
# never silent even when no Claude Code session is running. Triage and fix
# happen through the normal issue pipeline.
#
# When a watched workflow next passes, the same issue gets one comment saying
# so. Nothing used to mark a recovery, and a "CI failing on main" issue sat
# open at P1 through a day of green runs (#1386). The comment does not close
# the issue: a pass can be a flake going quiet, and that call is the
# triager's.
#
# A green run counts as a recovery only when the jobs that failed ran again
# and passed (#1437). CI on main path-filters: a docs-only merge is green
# with the Flutter suites skipped, which says nothing about a Flutter break.
# That case leaves no comment.
#
# Issue #537: this used to watch only "CI". supabase-migrate.yml,
# supabase-reconcile.yml, ios-release.yml, and play-store-release.yml failing
# on main produced no issue and no notification -- the direct cause of a
# 43-run supabase-migrate failure streak (issue #513) going unnoticed for the
# workflow's entire life. ci_watch.py now labels and titles by the failing
# workflow's own name so ops/release failures triage separately from app CI
# (see its `labels_for`/`issue_title`).

on:
  workflow_run:
    workflows:
      - "CI"
      - "Supabase migrate"
      - "Supabase Realtime reconciliation"
      - "iOS Release"
      - "Play Store Release"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  file-issue:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: File or update a prioritized issue, or note a recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          # LLA-114: the `branches: [main]` filter above matches on
          # head_branch alone, which a fork controls (its own default
          # branch is usually also named "main") -- ci_watch.py's
          # is_trusted_source re-validates that this run's code actually
          # came from this repository's own main, not a fork's
          # identically-named branch, before ever filing an issue.
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python3 tool/orchestrator/ci_watch.py
