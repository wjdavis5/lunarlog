name: Supabase Apple client-secret rotation

# Issue #974. Supabase's Apple provider needs a "client secret" that is not a
# static string: it is an ES256 JWT minted from the Sign in with Apple `.p8`
# key, and Apple caps that JWT's lifetime at six months. Nothing in Supabase
# can mint it for us and nothing warns when it lapses - the provider keeps
# issuing tokens until Apple rejects the exchange, so a missed rotation is
# invisible until a real user tries to sign in with Apple.
#
# This workflow mints a fresh secret and PATCHes it onto the project through
# the Supabase Management API. It runs roughly every five months (1 Jan /
# 1 Jun / 1 Nov, so at most ~153 days between runs) with a 175-day secret,
# which keeps the secret comfortably inside Apple's six-month cap even if a
# run slips by a few weeks for an approval or a disabled schedule.
#
# Why the Management API and not the CLI: AGENTS.md is explicit that
# `supabase config push` would push this repo's *local-only* settings
# (`site_url = http://127.0.0.1:3000`, the Apple provider disabled, local
# SMTP) onto the live project. There is no CLI equivalent of a single-field
# auth update, so a direct, scoped `PATCH .../config/auth` is the only safe
# path.
#
# The JWT's `sub` claim MUST be the Apple Services ID
# `com.wjdavis5.lunarlog.web`, never the bundle id `com.wjdavis5.lunarlog`.
# Both produce a well-formed JWT; only the Services ID one is accepted by
# Apple for the web flow. The minting logic (and that difference) lives in
# the unit-tested `.github/scripts/apple-client-secret.sh`, not inline here.
#
# Secrets: this job needs the `production` environment's SUPABASE_ACCESS_TOKEN
# and the three Apple SIWA secrets already used by supabase-migrate.yml
# (APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY). See AGENTS.md's "Config &
# Credential Locations". Nothing here is ever logged: the minted JWT is
# written straight to a mode-600 file in $RUNNER_TEMP, passed to `curl` with
# `--data-binary @file`, and the command verifies the stored value without
# ever printing it.
#
# Failure is loud by design. A failed GET/PATCH exits non-zero. The
# "missed rotation" step compares the age of this workflow's last successful
# run against the secret's usable lifetime and fails the job when the
# schedule has not fired inside the window - GitHub disables scheduled
# workflows after 60 days of repository inactivity, which is exactly the
# silent failure this issue exists to prevent.

on:
  schedule:
    # 1 January / 1 June / 1 November at 06:00 UTC (~every five months, at
    # most ~153 days apart - inside Apple's six-month cap with margin for a
    # delayed approval or a single missed run).
    - cron: '0 6 1 1,6,11 *'
  workflow_dispatch:

concurrency:
  # Never run two rotations at once; the later PATCH would overwrite the
  # earlier mint with an equally-valid secret, but serialising keeps the
  # logs unambiguous.
  group: supabase-apple-secret-rotation
  cancel-in-progress: false

permissions:
  contents: read
  # Read this workflow's own prior successful run for the missed-rotation
  # check below (the default token has no actions scope unless asked).
  actions: read

jobs:
  rotate:
    name: Mint and rotate the Apple client secret
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'dleexnnevuuddcgcpztq' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      # The Services ID - NOT the bundle id. `sub` is taken from this.
      APPLE_SERVICES_ID: com.wjdavis5.lunarlog.web
      # exp = now + (TTL - margin) days = 175 days, inside Apple's 6-month cap.
      APPLE_SECRET_TTL_DAYS: '180'
      APPLE_SECRET_MARGIN_DAYS: '5'
      # Flag a rotation gap before the 175-day secret could have lapsed.
      APPLE_SECRET_MAX_AGE_DAYS: '160'
      API_BASE: https://api.supabase.com/v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check required credentials
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then missing="$missing SUPABASE_ACCESS_TOKEN"; fi
          if [ -z "${APPLE_TEAM_ID:-}" ]; then missing="$missing APPLE_TEAM_ID"; fi
          if [ -z "${APPLE_KEY_ID:-}" ]; then missing="$missing APPLE_KEY_ID"; fi
          if [ -z "${APPLE_PRIVATE_KEY:-}" ]; then missing="$missing APPLE_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required \`production\` environment secret(s):${missing}. See AGENTS.md's 'Config & Credential Locations'."
            exit 1
          fi
          echo "All required production environment secrets are present."

      - name: Check for a missed rotation
        id: staleness
        # Compares the age of this workflow's last successful run against the
        # secret's usable lifetime. A late run still rotates; the check just
        # makes the gap a red run instead of a silent one.
        run: |
          set -euo pipefail
          runs_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/supabase-apple-secret-rotation.yml/runs?status=success&per_page=1"
          runs_json="$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$runs_url")"

          last_epoch="-"
          if printf '%s' "$runs_json" | jq -e '.message' >/dev/null 2>&1; then
            message="$(printf '%s' "$runs_json" | jq -r '.message')"
            echo "::warning::Could not read this workflow's run history ($message); skipped the missed-rotation check on this run."
          else
            last_iso="$(printf '%s' "$runs_json" | jq -r '.workflow_runs[0].run_started_at // empty')"
            if [ -n "$last_iso" ]; then
              last_epoch="$(date -u -d "$last_iso" +%s)"
              echo "Most recent successful rotation: $last_iso."
            else
              echo "No prior successful rotation recorded; treating this as the first run."
            fi
          fi

          state="$(bash .github/scripts/apple-client-secret.sh staleness "$last_epoch" "$(date -u +%s)" "$APPLE_SECRET_MAX_AGE_DAYS")"
          echo "Missed-rotation check: $state."
          if [ "$state" = "overdue" ]; then
            echo "overdue=true" >> "$GITHUB_OUTPUT"
          else
            echo "overdue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the current Apple auth config
        id: current
        run: |
          set -euo pipefail
          http="$(curl -sS -o "$RUNNER_TEMP/auth_config.json" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "$API_BASE/projects/$SUPABASE_PROJECT_REF/config/auth")"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            message="$(jq -r '.message // "no message"' "$RUNNER_TEMP/auth_config.json" 2>/dev/null || echo 'unparseable response')"
            echo "::error::Reading the project auth config failed with HTTP $http: $message"
            exit 1
          fi
          current_client_id="$(jq -r '.external_apple_client_id // ""' "$RUNNER_TEMP/auth_config.json")"
          rm -f "$RUNNER_TEMP/auth_config.json"
          echo "current_client_id=$current_client_id" >> "$GITHUB_OUTPUT"
          echo "Read the current external_apple_client_id."

      - name: Decide the external_apple_client_id value
        id: client_id
        env:
          CURRENT_CLIENT_ID: ${{ steps.current.outputs.current_client_id }}
        run: |
          set -euo pipefail
          merged="$(bash .github/scripts/apple-client-secret.sh client-id "$CURRENT_CLIENT_ID")"
          if [ "$merged" = "$CURRENT_CLIENT_ID" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "external_apple_client_id already lists both the bundle id and the Services ID; leaving it untouched."
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "merged_client_id=$merged" >> "$GITHUB_OUTPUT"
            echo "external_apple_client_id is missing an id and will be updated to list both."
          fi

      - name: Mint the client secret
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/apple_client_secret.jwt"
          bash .github/scripts/apple-client-secret.sh mint > "$secret_file"
          chmod 600 "$secret_file"
          if [ ! -s "$secret_file" ]; then
            echo "::error::The mint step produced no client secret."
            exit 1
          fi
          echo "Minted a fresh Apple client-secret JWT (value not logged)."

      - name: Patch the Apple client secret
        env:
          NEEDS_CLIENT_ID_UPDATE: ${{ steps.client_id.outputs.needs_update }}
          MERGED_CLIENT_ID: ${{ steps.client_id.outputs.merged_client_id }}
        run: |
          set -euo pipefail
          secret_file="$RUNNER_TEMP/apple_client_secret.jwt"
          patch_file="$RUNNER_TEMP/apple_patch.json"

          # --rawfile keeps the secret out of argv and off every log line;
          # rtrimstr drops the trailing newline `mint` writes.
          if [ "$NEEDS_CLIENT_ID_UPDATE" = "true" ]; then
            jq -cn --rawfile s "$secret_file" --arg cid "$MERGED_CLIENT_ID" \
              '{external_apple_secret: ($s | rtrimstr("\n")), external_apple_client_id: $cid}' > "$patch_file"
          else
            jq -cn --rawfile s "$secret_file" \
              '{external_apple_secret: ($s | rtrimstr("\n"))}' > "$patch_file"
          fi
          chmod 600 "$patch_file"

          http="$(curl -sS -o "$RUNNER_TEMP/patch_response.json" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$patch_file" \
            "$API_BASE/projects/$SUPABASE_PROJECT_REF/config/auth")"

          rm -f "$secret_file" "$patch_file"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            message="$(jq -r '.message // .error // "no message"' "$RUNNER_TEMP/patch_response.json" 2>/dev/null || echo 'unparseable response')"
            echo "::error::PATCH of the project auth config failed with HTTP $http: $message"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/patch_response.json"
          echo "PATCH of the project auth config succeeded (HTTP $http)."

      - name: Verify the deployed secret and client id
        # The PATCH response is never printed (it may echo the secret back).
        # This re-reads the config and asserts only non-secret facts: the
        # client-id list contains both ids, and the stored secret decodes to
        # the Services ID with a fresh `iat`. A silent no-op PATCH is caught
        # because the fresh `iat` would not be there.
        run: |
          set -euo pipefail
          verify_file="$RUNNER_TEMP/auth_verify.json"
          http="$(curl -sS -o "$verify_file" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "$API_BASE/projects/$SUPABASE_PROJECT_REF/config/auth")"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "::error::Verification GET of the project auth config failed with HTTP $http"
            exit 1
          fi

          verified_client_id="$(jq -r '.external_apple_client_id // ""' "$verify_file")"
          case ",$verified_client_id," in
            *",com.wjdavis5.lunarlog,"*) ;;
            *)
              echo "::error::external_apple_client_id does not contain the bundle id com.wjdavis5.lunarlog after the update (it is '$verified_client_id')"
              exit 1
              ;;
          esac
          case ",$verified_client_id," in
            *",com.wjdavis5.lunarlog.web,"*) ;;
            *)
              echo "::error::external_apple_client_id does not contain the Services ID com.wjdavis5.lunarlog.web after the update (it is '$verified_client_id')"
              exit 1
              ;;
          esac

          returned_file="$RUNNER_TEMP/returned_secret.jwt"
          jq -r '.external_apple_secret // ""' "$verify_file" > "$returned_file"
          rm -f "$verify_file"

          if [ -s "$returned_file" ]; then
            returned_sub="$(bash .github/scripts/apple-client-secret.sh jwt-claim sub < "$returned_file")"
            returned_iat="$(bash .github/scripts/apple-client-secret.sh jwt-claim iat < "$returned_file")"
            if [ "$returned_sub" != "com.wjdavis5.lunarlog.web" ]; then
              echo "::error::The stored Apple client secret's sub claim is '$returned_sub', not the Services ID com.wjdavis5.lunarlog.web. The secret would validate as a JWT and then be rejected by Apple."
              rm -f "$returned_file"
              exit 1
            fi
            if ! printf '%s' "$returned_iat" | grep -q '^[0-9][0-9]*$'; then
              echo "::error::The stored Apple client secret has no readable iat claim."
              rm -f "$returned_file"
              exit 1
            fi
            age=$(( $(date -u +%s) - returned_iat ))
            if [ "$age" -lt 0 ] || [ "$age" -gt 86400 ]; then
              echo "::error::The stored Apple client secret is not the one this run minted (iat is not fresh); the PATCH did not take effect."
              rm -f "$returned_file"
              exit 1
            fi
            echo "Verified: the stored secret's sub is the Services ID and its iat is fresh."
          else
            echo "::notice::The project did not return a decodable external_apple_secret, so the stored value could not be re-read via the API. The PATCH was accepted; the minting logic itself is unit tested."
          fi
          rm -f "$returned_file"

      - name: Fail loudly on a missed rotation
        # Runs even if an earlier step failed (the job is already red then),
        # so a late rotation is always reported rather than swallowed.
        if: always() && steps.staleness.outputs.overdue == 'true'
        run: |
          echo "::error::The previous successful Apple client-secret rotation is more than $APPLE_SECRET_MAX_AGE_DAYS days old, past the point where the ~175-day secret should have been replaced. Scheduled workflows are disabled after 60 days of repository inactivity, and this one runs roughly every five months, so the schedule was missed and sign-in with Apple may have been broken until this run repaired it. Investigate why the schedule did not fire, then dispatch this workflow manually if another rotation is needed."
          exit 1
