name: Supabase Realtime reconciliation

# Weekly scheduled job (Issue #453 / D-32) that re-runs
# public.reconcile_realtime_publication() against the production project to
# catch and correct any drift introduced between deploys (e.g. an out-of-band
# Supabase Studio "Enable Realtime" toggle). Fails if the publication membership
# after reconciliation differs from the expected set (only public.sync_signals).

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: supabase-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile Realtime publication
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.116.0

      - name: Check credentials
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on the production environment."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set on the production environment."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set on the production environment."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Reconcile Realtime publication
        run: |
          supabase db query --linked \
            "select public.reconcile_realtime_publication();"

      - name: Verify publication membership
        run: |
          tables="$(supabase db query --linked \
            "select schemaname || '.' || tablename as table_name from pg_publication_tables where pubname = 'supabase_realtime' order by 1;" \
            --csv | grep -v "^table_name" | tr -d '\r')"
          echo "Current publication tables: $tables"
          if [ "$tables" != "public.sync_signals" ]; then
            echo "::error::Expected supabase_realtime publication to contain only public.sync_signals, but found: $tables"
            exit 1
          fi
          echo "Realtime publication verified: only public.sync_signals published."
