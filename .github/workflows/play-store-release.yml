name: Play Store Release

# Builds, signs, and publishes an Android App Bundle (AAB) to Google Play.
#
# Mirrored from the release architecture in taxiGame / kegel_trainer.
#
# Manual only -- there is no push trigger; every run is a workflow_dispatch
# to internal, alpha, beta, or production. A `production` dispatch is
# additionally gated: it requires the account-deletion release gate
# (issue #17) to be open AND a typed `confirm_production` confirmation, both
# enforced by the `production-gate` job before any build runs. See
# .github/scripts/check-release-gate.sh (issue #41, finding #7).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64       Base64-encoded release keystore (.jks or .keystore)
#   ANDROID_KEYSTORE_PASSWORD     Keystore password
#   ANDROID_KEY_ALIAS             Alias of the signing key
#   ANDROID_KEY_PASSWORD          Password for the key
#   PLAY_STORE_JSON_KEY           Google Play Console Service Account JSON credentials
#   SUPABASE_URL                  Supabase project URL (client-safe)
#   SUPABASE_ANON_KEY             Supabase publishable key (client-safe);
#                                 passed as SUPABASE_PUBLISHABLE_KEY
#   SENTRY_DSN                    Sentry DSN (client-safe; empty disables)
#   SENTRY_AUTH_TOKEN             Sentry org auth token, project:releases scope
#                                 only (issue #19); native-symbol upload warns
#                                 and skips when this or the next two are empty
#   SENTRY_ORG                    Sentry organization slug
#   SENTRY_PROJECT                Sentry project slug

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      status:
        description: 'Release status'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
        default: completed
      confirm_production:
        description: "Type 'production' to confirm a production release"
        type: string
        default: ''

env:
  FLUTTER_CHANNEL: stable
  PACKAGE_NAME: com.wjdavis5.lunarlog

concurrency:
  # Monotonic build numbers must not race; keep one release running at a time.
  group: play-store-release
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  production-gate:
    # Fails fast, before any build work, when track is 'production' unless
    # both the account-deletion release gate (issue #17) is open and the
    # dispatcher typed the exact confirmation string. Deliberately has no
    # job-level `if:` -- a skipped `needs` job by default also skips its
    # dependent job, which would block every non-production dispatch. This
    # job always runs and always succeeds except for the production case it
    # exists to gate.
    name: Verify the production release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip for non-production tracks
        if: inputs.track != 'production'
        env:
          TRACK: ${{ inputs.track }}
        run: echo "track is '$TRACK', not production; nothing to gate here."

      - uses: actions/checkout@v4
        if: inputs.track == 'production'

      - name: Enforce the production gate
        if: inputs.track == 'production'
        env:
          RELEASE_GATE_ACCOUNT_DELETION: ${{ vars.RELEASE_GATE_ACCOUNT_DELETION }}
          REQUIRE_PRODUCTION_CONFIRMATION: 'true'
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: bash .github/scripts/check-release-gate.sh

  release:
    name: Build, sign, and publish to Play Store
    needs: [verify, production-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve build and version numbers
        id: version
        run: |
          set -euo pipefail

          marketing="$(bash .github/scripts/extract-marketing-version.sh < pubspec.yaml)"

          # Offset build number monotonically with GitHub Actions run counter
          build_number=$(( ${{ github.run_number }} + 1000 ))

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $marketing ($build_number)"

      - name: Configure Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or not configured."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Android release signing configured."

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Verify build outputs
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          apk="build/app/outputs/flutter-apk/app-release.apk"

          [ -f "$aab" ] || { echo "::error::AAB file not found at $aab"; exit 1; }
          [ -f "$apk" ] || { echo "::error::APK file not found at $apk"; exit 1; }

          echo "AAB size: $(du -h "$aab" | cut -f1)"
          echo "APK size: $(du -h "$apk" | cut -f1)"

      - name: Upload Sentry debug symbols (native + ProGuard mapping)
        # U5 (R15/R16/R17): warns and skips rather than failing the release
        # when the upload secrets are absent -- true for every build today,
        # since issue #19 has not provisioned them yet. sentry-cli is
        # installed as a pinned, checksum-verified release binary, never
        # `curl | bash` (KTD10). The ProGuard upload is a documented no-op
        # today: R8/minification is not enabled by this plan (see Scope
        # Boundaries), so no mapping.txt exists yet; the conditional exists
        # so enabling R8 later needs no workflow edit. The guard/download/
        # verify logic is shared with ios-release.yml via
        # upload-sentry-symbols-setup.sh (tested in CI's release-guards
        # jobs); only the download URL/checksum and the upload commands
        # themselves are platform-specific.
        #
        # continue-on-error (R15): once issue #19 provisions the secrets, a
        # Sentry hiccup (download timeout, transient 5xx, a yanked release
        # asset) must degrade telemetry, never block a signed Play upload --
        # this is symbol upload, not the release artifact itself.
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_CLI_DOWNLOAD_URL: https://github.com/getsentry/sentry-cli/releases/download/3.7.0/sentry-cli-Linux-x86_64
          SENTRY_CLI_SHA256: cec71d46a7cc394c94b6e75f1601985c710d457376c546ef3975567b3671563b
          SENTRY_CLI_CHECKSUM_TOOL: sha256sum
        run: |
          bash .github/scripts/upload-sentry-symbols-setup.sh
          if [ -x ./sentry-cli ]; then
            # Verified empirically against this toolchain's real
            # `flutter build appbundle --release` output tree (Q2) -- AGP's
            # merge-native-libs task nests an extra `mergeReleaseNativeLibs`
            # segment that a naive guess at the path misses.
            native_libs_dir="build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib"
            if [ -d "$native_libs_dir" ]; then
              ./sentry-cli debug-files upload "$native_libs_dir"
            else
              echo "::warning::No native libs directory found at $native_libs_dir -- skipping native symbol upload."
            fi

            mapping="build/app/outputs/mapping/release/mapping.txt"
            if [ -f "$mapping" ]; then
              ./sentry-cli upload-proguard "$mapping"
            fi
          fi

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
          changesNotSentForReview: false

      - name: Clean up keystore
        if: always()
        run: |
          set -euo pipefail
          rm -f "${KEYSTORE_FILE:-}" android/key.properties
          echo "Signing keys scrubbed."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
