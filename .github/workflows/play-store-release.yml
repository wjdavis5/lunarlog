name: Play Store Release

# Builds, signs, and publishes an Android App Bundle (AAB) to Google Play.
#
# Mirrored from the release architecture in taxiGame / kegel_trainer.
#
# Manual only -- there is no push trigger; every run is a workflow_dispatch
# to internal, alpha, beta, or production. A `production` dispatch is
# additionally gated: it requires the account-deletion release gate
# (issue #17) to be open AND a typed `confirm_production` confirmation, both
# enforced by the `production-gate` job before any build runs. See
# .github/scripts/check-release-gate.sh (issue #41, finding #7).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64       Base64-encoded release keystore (.jks or .keystore)
#   ANDROID_KEYSTORE_PASSWORD     Keystore password
#   ANDROID_KEY_ALIAS             Alias of the signing key
#   ANDROID_KEY_PASSWORD          Password for the key
#   PLAY_STORE_JSON_KEY           Google Play Console Service Account JSON credentials
#   SUPABASE_URL                  Supabase project URL (client-safe)
#   SUPABASE_ANON_KEY             Supabase publishable key (client-safe);
#                                 passed as SUPABASE_PUBLISHABLE_KEY
#   SENTRY_DSN                    Sentry DSN (client-safe; empty disables)

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      status:
        description: 'Release status'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
        default: completed
      confirm_production:
        description: "Type 'production' to confirm a production release"
        type: string
        default: ''

env:
  FLUTTER_CHANNEL: stable
  PACKAGE_NAME: com.wjdavis5.lunarlog

concurrency:
  # Monotonic build numbers must not race; keep one release running at a time.
  group: play-store-release
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  production-gate:
    # Fails fast, before any build work, when track is 'production' unless
    # both the account-deletion release gate (issue #17) is open and the
    # dispatcher typed the exact confirmation string. Deliberately has no
    # job-level `if:` -- a skipped `needs` job by default also skips its
    # dependent job, which would block every non-production dispatch. This
    # job always runs and always succeeds except for the production case it
    # exists to gate.
    name: Verify the production release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip for non-production tracks
        if: inputs.track != 'production'
        env:
          TRACK: ${{ inputs.track }}
        run: echo "track is '$TRACK', not production; nothing to gate here."

      - uses: actions/checkout@v4
        if: inputs.track == 'production'

      - name: Enforce the production gate
        if: inputs.track == 'production'
        env:
          RELEASE_GATE_ACCOUNT_DELETION: ${{ vars.RELEASE_GATE_ACCOUNT_DELETION }}
          REQUIRE_PRODUCTION_CONFIRMATION: 'true'
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: bash .github/scripts/check-release-gate.sh

  release:
    name: Build, sign, and publish to Play Store
    needs: [verify, production-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve build and version numbers
        id: version
        run: |
          set -euo pipefail

          marketing="$(bash .github/scripts/extract-marketing-version.sh < pubspec.yaml)"

          # Offset build number monotonically with GitHub Actions run counter
          build_number=$(( ${{ github.run_number }} + 1000 ))

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $marketing ($build_number)"

      - name: Configure Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or not configured."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Android release signing configured."

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Verify build outputs
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          apk="build/app/outputs/flutter-apk/app-release.apk"

          [ -f "$aab" ] || { echo "::error::AAB file not found at $aab"; exit 1; }
          [ -f "$apk" ] || { echo "::error::APK file not found at $apk"; exit 1; }

          echo "AAB size: $(du -h "$aab" | cut -f1)"
          echo "APK size: $(du -h "$apk" | cut -f1)"

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
          changesNotSentForReview: false

      - name: Clean up keystore
        if: always()
        run: |
          set -euo pipefail
          rm -f "${KEYSTORE_FILE:-}" android/key.properties
          echo "Signing keys scrubbed."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
