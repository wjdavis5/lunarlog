name: Play Store Release

# Builds, signs, and publishes an Android App Bundle (AAB) to Google Play.
#
# Mirrored from the release architecture in taxiGame / kegel_trainer.
#
# Two modes:
#   - Automated: Pushes to main build and publish to the 'internal' testing track.
#   - Manual (workflow_dispatch): Deploy to internal, alpha, beta, or production tracks.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64       Base64-encoded release keystore (.jks or .keystore)
#   ANDROID_KEYSTORE_PASSWORD     Keystore password
#   ANDROID_KEY_ALIAS             Alias of the signing key
#   ANDROID_KEY_PASSWORD          Password for the key
#   PLAY_STORE_JSON_KEY           Google Play Console Service Account JSON credentials

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      status:
        description: 'Release status'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
        default: completed

env:
  FLUTTER_CHANNEL: stable
  PACKAGE_NAME: com.wjdavis5.lunarlog

concurrency:
  # Monotonic build numbers must not race; keep one release running at a time.
  group: play-store-release
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: Build, sign, and publish to Play Store
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve build and version numbers
        id: version
        run: |
          set -euo pipefail

          # Read marketing version from pubspec.yaml (e.g. 1.0.0)
          marketing="$(grep '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d'+' -f1)"

          # Offset build number monotonically with GitHub Actions run counter
          build_number=$(( ${{ github.run_number }} + 1000 ))

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $marketing ($build_number)"

      - name: Configure Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or not configured."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Android release signing configured."

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Verify build outputs
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          apk="build/app/outputs/flutter-apk/app-release.apk"

          [ -f "$aab" ] || { echo "::error::AAB file not found at $aab"; exit 1; }
          [ -f "$apk" ] || { echo "::error::APK file not found at $apk"; exit 1; }

          echo "AAB size: $(du -h "$aab" | cut -f1)"
          echo "APK size: $(du -h "$apk" | cut -f1)"

      - name: Publish to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
          changesNotSentForReview: false

      - name: Clean up keystore
        if: always()
        run: |
          set -euo pipefail
          rm -f "${KEYSTORE_FILE:-}" android/key.properties
          echo "Signing keys scrubbed."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
