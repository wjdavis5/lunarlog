name: Site deploy (Cloudflare Workers)

# Issue #450, grown into the marketing site by issue #1099: one Cloudflare
# Worker serves the lunarlog.app apex -- the Astro build in `site/dist` plus
# the universal-link files (`/.well-known/apple-app-site-association`,
# `/invite*`) the Worker answers itself.
#
# Renamed from links-deploy.yml (issue #1099). One workflow deploys the apex;
# the Worker keeps its original `lunarlog-links` name so the Custom Domain is
# not re-attached (issue #1099 allows either).
#
# Scope: the static Astro pages, the AASA, and /invite*. Android
# assetlinks.json is omitted until release fingerprints exist. `/fhir/*` is
# reserved (issue #961): a plain 404, never a redirect.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
      - '.github/scripts/check-links-deploy.sh'
  workflow_dispatch:

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy the site Worker to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Astro 7 requires Node >= 22.12; pin the major, not the runner's
          # default, so a runner-image change cannot move the toolchain.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Build the site
        # `npm run build` runs `astro sync`, `astro check`, and the static
        # build to `site/dist`. A type error fails the deploy before upload.
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Check the Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; skipping the Cloudflare Worker deploy."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Issue #1090: 3.89.0 warns "Unexpected fields found in assets
          # field: run_worker_first" and would deploy without the routing
          # fix. 4.20.0 is the lowest 4.x that accepts the array form and it
          # handles `_headers` / `_redirects` and `not_found_handling`
          # (issue #1099; verified with `wrangler deploy --dry-run`: the
          # 4.20.0 bundle carries the `_headers` asset handling and the
          # dry-run reports no unknown-field warning). 4.19.0 rejects the
          # array form.
          wranglerVersion: '4.20.0'
          workingDirectory: 'site'
          command: deploy --config wrangler.jsonc

      - name: Smoke-check the deployed routes
        # Issue #1090: the unit tests call the handler directly, so only a
        # live check can catch the asset-first routing failure this issue
        # documents. Issue #1099 extends it to the marketing pages: `/` must
        # carry the CSP/HSTS posture from `site/public/_headers`, and the 404
        # page (including the reserved `/fhir/*` paths) must stay a 404.
        # Retries for ~90 s to allow for edge propagation.
        if: steps.cloudflare.outputs.configured == 'true'
        run: bash .github/scripts/check-links-deploy.sh
