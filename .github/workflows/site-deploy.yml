name: Site deploy (Cloudflare Workers)

# Issue #450, grown into the marketing site by issue #1099: one Cloudflare
# Worker serves the lunarlog.app apex -- the Astro build in `site/dist` plus
# the universal-link files (`/.well-known/apple-app-site-association`,
# `/invite*`) the Worker answers itself.
#
# Renamed from links-deploy.yml (issue #1099). One workflow deploys the apex;
# the Worker keeps its original `lunarlog-links` name so the Custom Domain is
# not re-attached (issue #1099 allows either).
#
# Scope: the static Astro pages, the AASA, and /invite*. Android
# assetlinks.json is omitted until release fingerprints exist. `/fhir/*` is
# reserved (issue #961): a plain 404, never a redirect.
#
# Issue #1104: the deploy job also generates the app screenshots (from the
# fabricated dataset in `tool/screenshots/`, at the pinned Flutter SDK)
# into `site/public/screenshots/` before `astro build` — the PNGs are never
# committed, so `lib/ui/**` and `tool/screenshots/**` changes redeploy the
# site with fresh ones.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      # Issue #1101: /privacy renders PRIVACY.md at build time, so a policy
      # change must redeploy the site in the same merge, with no manual step.
      - 'PRIVACY.md'
      - '.github/workflows/site-deploy.yml'
      - '.github/scripts/check-links-deploy.sh'
      # Issue #1104: the site's screenshots are generated here (never
      # committed), so a change to the app UI they render — or to the
      # tool that renders them — must redeploy the site with fresh PNGs
      # (the issue's second acceptance criterion).
      - 'lib/ui/**'
      - 'tool/screenshots/**'
      # Issue #1431: the home page's browser figure is the React web
      # client's own capture, so a webapp change can change what the site
      # shows the way a lib/ui change can. (A successful browser-version
      # deploy already redeploys the site through the workflow_run trigger
      # below; this path covers a webapp merge whose deploy did not run.)
      - 'webapp/**'
  # The site links to the browser version at app.lunarlog.app only while
  # that address is serving it (see the probe step below). A deploy of the
  # browser version that succeeds is when the answer can change, so the
  # site is rebuilt after one: the button comes back on its own once the
  # address does, with nobody having to remember to redeploy the site.
  workflow_run:
    workflows: ['Web app staging deploy (Cloudflare Workers)']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy the site Worker to Cloudflare
    # After a deploy of the browser version, only when it succeeded: a
    # failed one changed nothing the site could say differently.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Issue #1431: the web client's Playwright capture (webapp npm ci +
    # build + Chromium) joined the Flutter screenshot render. 30 minutes
    # had no headroom for the added minutes.
    timeout-minutes: 40
    env:
      # Pinned to the same SDK every other workflow builds with (see
      # FLUTTER_VERSION in ci.yml) so the screenshots render with the
      # exact engine the app ships on.
      FLUTTER_VERSION: '3.47.2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned, not the runner's default, so a runner-image change
          # cannot move the toolchain; and pinned in one place,
          # site/.nvmrc, which site.yml reads too (issue #1602: it is 24
          # for its npm 11, the npm that writes the lockfile). Astro 7
          # needs Node >= 22.12 either way. Issue #1431: the webapp
          # lockfile is cached too — the browser capture below installs
          # webapp/ to run its Playwright spec.
          node-version-file: 'site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            site/package-lock.json
            webapp/package-lock.json

      # Issue #1104: generate the app screenshots before the site build.
      # The PNGs land in site/public/screenshots/ (gitignored — never
      # committed) and ride the normal public/ -> dist/ copy. Rendered by
      # `flutter test` over the fabricated dataset in tool/screenshots/ at
      # the pinned SDK, so the same commit always renders the same bytes.
      - name: Install the pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the app screenshots
        working-directory: site
        run: |
          # The runner's cached SDK (flutter-action cache: true) can carry
          # material_fonts.stamp without a usable artifact — the same
          # failure #1105 fixed in site.yml's PR job ("Material Icons font
          # not found"). Drop the stamp and --force the re-download; the
          # ls lines leave ground truth in the log if it ever breaks
          # differently.
          rm -f "$FLUTTER_ROOT/bin/cache/material_fonts.stamp"
          ls -la "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/" 2>/dev/null || echo "material_fonts missing before precache"
          flutter precache --universal --force
          ls -la "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/"
          flutter pub get
          npm run screenshots

      - name: Ask app.lunarlog.app whether it is serving the browser version
        # The home page's main button, and links on three other pages, lead
        # to app.lunarlog.app. In October 2026 that address answered a
        # Cloudflare error page for hours while the site went on sending
        # people there. So the deploy asks first. The script prints `false`
        # only when the address answered and the answer was not the browser
        # version; the site is then built with a plain notice in place of
        # the button and the links (site/src/lib/web-app.mjs). If the
        # address cannot be reached from this runner at all it prints
        # `true`, and the site is built as usual.
        working-directory: site
        run: |
          set -euo pipefail
          live="$(node scripts/probe-web-app.mjs)"
          echo "LUNARLOG_WEB_APP_LIVE=${live}" >> "$GITHUB_ENV"
          if [ "${live}" = "false" ]; then
            echo "::warning::app.lunarlog.app is not serving the browser version. The site is being deployed with a notice in place of its links to it. They return on the next site deploy after the address is back (one runs after every successful deploy of the browser version)."
          fi

      # Issue #1431: the home page's browser figure is the React web
      # client's own signed-in home — the Flutter harness cannot draw it
      # (its browser class stopped being rendered in the same change;
      # tool/screenshots/manifest.dart's kFlutterRenderedDevices). The
      # capture runs after the Flutter renders and before the site build,
      # writing into the same gitignored site/public/screenshots/ the
      # build copies into dist/.
      - name: Compile the browser version's domain module
        # The today-log card the figure shows is computed by the compiled
        # Dart domain module (issue #1251) — the same dart2js artifact the
        # webapp CI job builds, same command.
        run: |
          flutter pub get
          dart compile js -O2 --no-source-maps tool/web_domain/main.dart \
            -o webapp/public/domain/lunarlog_domain.js
          rm -f webapp/public/domain/lunarlog_domain.js.deps

      - name: Install the web app's dependencies and Playwright Chromium
        working-directory: webapp
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the browser version
        # The client-safe Supabase pair, quoted for the same reason the
        # webapp CI job quotes them: empty on forks, and the capture then
        # skips on an unconfigured build. In the canonical repo with secrets,
        # LUNARLOG_APP_CONFIGURED ensures the capture never skips quietly (issue #1662).
        working-directory: webapp
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Capture the browser version's home screenshot
        working-directory: webapp
        env:
          LUNARLOG_BROWSER_CAPTURE_OUT: ${{ github.workspace }}/site/public/screenshots
          LUNARLOG_APP_CONFIGURED: ${{ secrets.SUPABASE_URL != '' && 'true' || 'false' }}
        run: npx playwright test e2e/browser-home-capture.spec.ts

      - name: Verify the browser home screenshot was captured
        # Issue #1662: fail immediately if the capture skipped or failed
        # to produce the PNG while the browser version is live, rather than
        # deploying a broken <img> on the home page.
        if: env.LUNARLOG_WEB_APP_LIVE != 'false'
        run: test -f site/public/screenshots/today-browser-light.png

      - name: Build the site
        # `npm run build` runs `astro sync`, `astro check`, and the static
        # build to `site/dist`. A type error fails the deploy before upload.
        # LUNARLOG_WEB_APP_LIVE comes from the step above.
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Check the Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not configured; skipping the Cloudflare Worker deploy."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Issue #1090: 3.89.0 warns "Unexpected fields found in assets
          # field: run_worker_first" and would deploy without the routing
          # fix. 4.20.0 is the lowest 4.x that accepts the array form and it
          # handles `_headers` / `_redirects` and `not_found_handling`
          # (issue #1099; verified with `wrangler deploy --dry-run`: the
          # 4.20.0 bundle carries the `_headers` asset handling and the
          # dry-run reports no unknown-field warning). 4.19.0 rejects the
          # array form.
          wranglerVersion: '4.20.0'
          workingDirectory: 'site'
          command: deploy --config wrangler.jsonc

      - name: Smoke-check the deployed routes
        # Issue #1090: the unit tests call the handler directly, so only a
        # live check can catch the asset-first routing failure this issue
        # documents. Issue #1099 extends it to the marketing pages: `/` must
        # carry the CSP/HSTS posture from `site/public/_headers`, and the 404
        # page (including the reserved `/fhir/*` paths) must stay a 404.
        # Retries for ~90 s to allow for edge propagation.
        if: steps.cloudflare.outputs.configured == 'true'
        run: bash .github/scripts/check-links-deploy.sh
