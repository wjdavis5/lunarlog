name: iOS Release

# Builds, signs, and ships an iOS build. Manual dispatch only — the
# push-to-main trigger was removed so merges no longer auto-ship to
# TestFlight; run this workflow from the Actions tab when a release is
# wanted. App Store submission therefore reaches the build only through
# the explicit submit_for_review dispatch input (a dispatch without it
# never auto-submits; see .github/scripts/detect-version-bump.sh).
#
# Mirrored from taxiGame.
#
# Two stages of delivery:
#   - A dispatched run uploads a build to TestFlight.
#   - App Store review submission fires when dispatched with
#     submit_for_review: true. See
#     .github/scripts/detect-version-bump.sh for the detection logic and
#     .github/scripts/check-release-gate.sh for the account-deletion gate
#     that can withhold submission (issue #17, issue #41).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID                    App Store Connect API key ID
#   ASC_ISSUER_ID                 App Store Connect API issuer ID
#   ASC_PRIVATE_KEY               Full contents of the AuthKey_<KEY_ID>.p8 file
#   IOS_DIST_CERT_P12_BASE64      base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD        password protecting that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the app's App Store .mobileprovision
#   IOS_WIDGET_PROVISION_PROFILE_BASE64
#                                 base64 of the LunarLogWidget extension's App
#                                 Store .mobileprovision (issue #141/#1007); a
#                                 signed build signs both bundles and each needs
#                                 its own profile
#   SUPABASE_URL                  Supabase project URL (client-safe)
#   SUPABASE_ANON_KEY             Supabase publishable key (client-safe);
#                                 passed as SUPABASE_PUBLISHABLE_KEY
#   SENTRY_DSN                    Sentry DSN (client-safe; empty disables)
#   SENTRY_AUTH_TOKEN             Sentry org auth token, project:releases scope
#                                 only (issue #19); dSYM upload warns and
#                                 skips when this or the next two are empty
#   SENTRY_ORG                    Sentry organization slug
#   SENTRY_PROJECT                Sentry project slug

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit the build for App Store review'
        type: boolean
        default: false
      qa_build:
        description: 'QA build (issue #739): compiles LUNARLOG_QA_BUILD=true (no unlock gate, relock, or re-auth prompts). TestFlight-only — never submittable.'
        type: boolean
        default: false

env:
  FLUTTER_CHANNEL: stable
  # Pinned so a new stable release cannot change the shipped app without a
  # commit here (issue #208). Keep in sync with AGENTS.md's "Flutter SDK"
  # note and the build Mac.
  FLUTTER_VERSION: '3.47.2'
  BUNDLE_ID: com.wjdavis5.lunarlog

concurrency:
  # Never let two releases upload builds at once — build numbers must be
  # strictly increasing and a race would burn one.
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  migration-gate:
    # Issue #47, extracted into a reusable workflow by issue #539 so
    # play-store-release.yml can share the exact same gate instead of
    # shipping Android releases with no equivalent protection. See
    # .github/workflows/migration-gate.yml for the full rationale: it fails
    # the release when any migration in the repo is not applied to
    # production, fails closed on purpose (a blocked release is recoverable,
    # a client shipped against a missing schema is not).
    name: Verify Supabase migrations are applied
    uses: ./.github/workflows/migration-gate.yml
    # LLA-110: deployments:read (beyond this workflow's top-level
    # contents:read/checks:read default) is what lets the reusable
    # workflow's "Verify delete-account Edge Function deployment evidence"
    # step read back the GitHub Deployment supabase-migrate.yml recorded.
    permissions:
      contents: read
      deployments: read
    secrets: inherit

  release-gate:
    # Fails fast, before any build work, when a dispatcher explicitly
    # requests submission (submit_for_review: true) while the
    # account-deletion release gate (issue #17) is closed. Deliberately has
    # no job-level `if:` -- a skipped `needs` job by default also skips its
    # dependent job, which would block every ordinary release dispatch. This
    # job always runs and always succeeds except in the one case it exists
    # to catch.
    name: Verify the release gate for explicit submission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip when not an explicit submission dispatch
        if: github.event_name != 'workflow_dispatch' || inputs.submit_for_review != true
        run: echo "Not an explicit submit_for_review dispatch; nothing to gate here."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'workflow_dispatch' && inputs.submit_for_review == true

      - name: Enforce the release gate
        if: github.event_name == 'workflow_dispatch' && inputs.submit_for_review == true
        env:
          RELEASE_GATE_ACCOUNT_DELETION: ${{ vars.RELEASE_GATE_ACCOUNT_DELETION }}
        run: bash .github/scripts/check-release-gate.sh

  qa-build-gate:
    # Issue #739: a QA build (qa_build: true) compiles the client-side
    # security-prompt bypasses in, so it must never be submitted for App
    # Store review — a submit_for_review dispatch later ships *that same
    # binary* to store users. Fails fast, before any build work, whenever
    # both inputs are set. Deliberately has no job-level `if:` (the same
    # reasoning as release-gate above): this job always runs and always
    # succeeds except in the one case it exists to catch, so it can never
    # silently skip a dispatch it should have gated.
    name: Verify the QA build gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Refuse QA builds at App Store submission
        env:
          QA_BUILD: ${{ inputs.qa_build }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
        run: bash .github/scripts/check-qa-build-gate.sh

  ci-gate:
    # Issue #498: Gate release on successful completion of CI verification runs
    # (pgTAP database tests, Deno edge function tests, and the sharded
    # verify/test/quality-gate jobs — see check-ci-gate.sh's REQUIRED_CHECKS
    # default for the exact post-#644 job names).
    name: Verify CI check runs on commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify CI checks passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash .github/scripts/check-ci-gate.sh

  release:
    name: Build, sign, and upload to TestFlight
    needs: [verify, migration-gate, release-gate, qa-build-gate, ci-gate]
    # This is a manual (workflow_dispatch-only) trigger, so a fork PR can
    # never reach this job -- kept for consistency with ci.yml's self-hosted
    # jobs (issue #514), which guard against the pull_request case this
    # runner also executes.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Issue #583 / PR #586: deliberately the ephemeral GitHub-hosted runner,
    # NOT the self-hosted build Mac. On that Mac (runner "williams-mini") the
    # job fails at Export IPA with `Provisioning profile "Lunarlog" doesn't
    # include signing certificate "Apple Distribution: William Davis
    # (5273C9R3V4)"`: its persistent keychains carry a distribution identity
    # that the static IOS_PROVISION_PROFILE_BASE64 secret does not embed, and
    # xcodebuild can resolve that identity instead of the
    # IOS_DIST_CERT_P12_BASE64 one. The two secrets are mutually consistent
    # -- they export and upload cleanly on a fresh runner. Moving this job
    # back to [self-hosted, macOS] requires reconciling that Mac's local
    # signing state with the repo secrets first; the self-hosted
    # accommodations kept below (UTF-8 locale for `pod install`, exact-path
    # profile cleanup) are for that future switch, not a signal that the job
    # belongs there today.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Reading pubspec.yaml at an arbitrary before-commit (see the
          # `Detect a version bump` step below) needs full history --
          # fetch-depth: 2 only has the tip and its parent.
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve build and version numbers
        id: version
        env:
          QA_BUILD: ${{ inputs.qa_build }}
        run: |
          set -euo pipefail

          marketing="$(bash .github/scripts/extract-marketing-version.sh < pubspec.yaml)"

          # Build number comes from monotonic run counter
          build_number=$(( ${{ github.run_number }} + 1000 ))

          # Issue #739: QA builds occupy a distinct, far-removed
          # build-number range (501xxx vs the 1xxx-10xxx production
          # range), so a QA binary is recognisable in TestFlight at a
          # glance and a manual promotion in App Store Connect is
          # catchable before it ships.
          if [ "$QA_BUILD" = "true" ]; then
            build_number=$(( build_number + 500000 ))
          fi

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $marketing ($build_number)"

      - name: Detect a version bump
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          CURRENT_VERSION: ${{ steps.version.outputs.marketing }}
        run: bash .github/scripts/detect-version-bump.sh

      - name: Check the release gate (warn-only)
        # A bump was detected, but the account-deletion release gate
        # (issue #17) governs whether it may actually submit. Closed here
        # degrades to a warning rather than failing the run -- TestFlight
        # delivery must not be denied for a policy reason.
        id: gate
        if: steps.bump.outputs.submit == 'true'
        env:
          RELEASE_GATE_ACCOUNT_DELETION: ${{ vars.RELEASE_GATE_ACCOUNT_DELETION }}
          RELEASE_GATE_MODE: warn
        run: bash .github/scripts/check-release-gate.sh

      - name: Install the App Store Connect API key
        # Issue #571: this used to write into $HOME/.appstoreconnect,
        # mutating the developer's own home directory on their personal
        # Mac -- a later `rm -rf` of that same path in cleanup would
        # destroy any ASC key the human had installed there for their own
        # use. Written into $RUNNER_TEMP instead (job-scoped, not shared
        # with the human's environment); API_PRIVATE_KEYS_DIR is Apple's
        # own supported redirect for altool/notarytool to look somewhere
        # other than ~/.appstoreconnect/private_keys (altool has no
        # `--apiKeyPath` flag to pass this directly), recorded via
        # $GITHUB_ENV for the "Upload to TestFlight" step below.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keys_dir="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$keys_dir"
          key_path="$keys_dir/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "API_PRIVATE_KEYS_DIR=$keys_dir" >> "$GITHUB_ENV"

      - name: Configure signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::Secret IOS_DIST_CERT_P12_BASE64 is empty or not configured."
            exit 1
          fi

          # Isolated keychain per run
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12
          rm -f "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          existing_keychains=()
          while IFS= read -r kc; do
            existing_keychains+=("$kc")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
          security list-keychains -d user -s "$keychain" ${existing_keychains[@]+"${existing_keychains[@]}"}

          echo "Imported identities:"
          security find-identity -v -p codesigning "$keychain"

      - name: Install the provisioning profile
        # Xcode only discovers profiles from $HOME/Library/MobileDevice --
        # there's no per-job-scoped location it will look in instead, so
        # this step still has to write there. Issue #571: the previous
        # version never removed what it copied in, so profiles accumulate
        # here across every release run on this shared, non-ephemeral Mac
        # (it also serves AGENTS.md's "iOS Local Device Builds") and a stale
        # one can make Xcode pick the wrong profile for a local device
        # build. The exact installed path is recorded via $GITHUB_ENV so
        # the cleanup step below can `rm -f` precisely that file, never
        # anything the human installed themselves.
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_PROVISION_PROFILE_BASE64 is empty or not configured."
            exit 1
          fi

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"

          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          name="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -o - -)"
          installed_path="$profiles/$uuid.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$installed_path"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_PATH=$installed_path" >> "$GITHUB_ENV"
          echo "Installed profile '$name' ($uuid)"

      - name: Install the widget provisioning profile
        # Issue #141 / PR #1007: the home-screen widget is a separate app
        # extension with its own App ID
        # (com.wjdavis5.lunarlog.LunarLogWidget) and its own App Store
        # provisioning profile. Because the shared App Group
        # (group.com.wjdavis5.lunarlog.widgets) must be declared on BOTH App
        # IDs, a signed App Store build now needs TWO profiles; the export
        # below fails if either bundle id has no profile in
        # ExportOptions-ci.plist. This mirrors the step above -- same
        # base64-decode + security cms -D UUID/Name extraction, same
        # recorded-path cleanup, same fail-closed-on-empty handling -- so a
        # missing secret is named here instead of surfacing as a generic
        # export failure after a full archive. It runs before the archive
        # deliberately: failing early is the whole point.
        env:
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$WIDGET_PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_WIDGET_PROVISION_PROFILE_BASE64 is empty or not configured. A signed build signs the LunarLogWidget extension too, and it cannot be signed without this profile; see the Home-screen widget checklist in docs/ops/supabase-go-live.md."
            exit 1
          fi

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"

          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget-profile.mobileprovision"

          uuid="$(security cms -D -i "$RUNNER_TEMP/widget-profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          name="$(security cms -D -i "$RUNNER_TEMP/widget-profile.mobileprovision" | plutil -extract Name raw -o - -)"
          installed_path="$profiles/$uuid.mobileprovision"
          cp "$RUNNER_TEMP/widget-profile.mobileprovision" "$installed_path"
          rm -f "$RUNNER_TEMP/widget-profile.mobileprovision"

          echo "WIDGET_PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "WIDGET_PROVISIONING_PROFILE_PATH=$installed_path" >> "$GITHUB_ENV"
          echo "Installed widget profile '$name' ($uuid)"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            ios/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter assets
        # Issue #572: every value here -- the version/build outputs and
        # every secret -- goes through env: and is referenced quoted. A
        # version string containing a trailing comment (see
        # extract-marketing-version.sh's hardening) spliced unquoted into
        # `--build-name=$marketing \` would silently comment out the rest
        # of this command, including every --dart-define, and the build
        # would still succeed -- just with no Supabase/Sentry/FCM
        # configuration at all.
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          QA_BUILD: ${{ inputs.qa_build }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
          FCM_ANDROID_API_KEY: ${{ secrets.FCM_ANDROID_API_KEY }}
          FCM_ANDROID_APP_ID: ${{ secrets.FCM_ANDROID_APP_ID }}
          FCM_IOS_API_KEY: ${{ secrets.FCM_IOS_API_KEY }}
          FCM_IOS_APP_ID: ${{ secrets.FCM_IOS_APP_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$MARKETING_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=FCM_SENDER_ID="$FCM_SENDER_ID" \
            --dart-define=FCM_ANDROID_API_KEY="$FCM_ANDROID_API_KEY" \
            --dart-define=FCM_ANDROID_APP_ID="$FCM_ANDROID_APP_ID" \
            --dart-define=FCM_IOS_API_KEY="$FCM_IOS_API_KEY" \
            --dart-define=FCM_IOS_APP_ID="$FCM_IOS_APP_ID" \
            --dart-define=LUNARLOG_QA_BUILD="$QA_BUILD"

      - name: Install CocoaPods dependencies
        env:
          # Self-hosted runner's default shell locale is not UTF-8, which
          # crashes CocoaPods in Pod::Config#installation_root
          # (Encoding::CompatibilityError: Unicode Normalization not
          # appropriate for ASCII-8BIT) when it unicode_normalizes the
          # installation path. CocoaPods' own fix is exactly this export.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: cd ios && pod install && cd ..

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions-ci.plist \
            -exportPath build/ios/ipa

          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::export produced no .ipa"; exit 1; }

          workdir="$RUNNER_TEMP/ipa-verify"
          rm -rf "$workdir" && mkdir -p "$workdir"
          unzip -q "$ipa" -d "$workdir"
          app="$(ls -d "$workdir"/Payload/*.app)"

          authority="$(codesign -dvv "$app" 2>&1 | grep '^Authority=' | head -1)"
          echo "$authority"
          case "$authority" in
            *"Apple Distribution"*) ;;
            *) echo "::error::expected an Apple Distribution signature, got: $authority"; exit 1 ;;
          esac

      - name: Verify the exported bundle
        run: |
          set -euo pipefail
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          plist="$app/Info.plist"

          minimum="$(plutil -extract MinimumOSVersion raw -o - "$plist")"
          identifier="$(plutil -extract CFBundleIdentifier raw -o - "$plist")"
          # ITSAppUsesNonExemptEncryption may legitimately be absent from a
          # stale build, so extract it without letting set -e abort the step
          # before the compliance-specific error can print (issue #48, U3).
          encryption="$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$plist" 2>/dev/null || echo "MISSING")"

          echo "minimum OS: $minimum, bundle: $identifier, export compliance (uses non-exempt encryption): $encryption"

          [ "$identifier" = "$BUNDLE_ID" ] || { echo "::error::bundle id is $identifier, expected $BUNDLE_ID"; exit 1; }
          awk -v v="$minimum" 'BEGIN { split(v, p, "."); if (p[1] < 15) { print "::error::MinimumOSVersion " v " is below the 15.0 Apple requires"; exit 1 } }'

          [ -f "$app/PrivacyInfo.xcprivacy" ] || { echo "::error::privacy manifest missing from the bundle"; exit 1; }

          # Issue #766: App Store Connect rejected build 1135 with ITMS-90683
          # for a missing NSHealthShareUsageDescription. That check fires on
          # entitlements that PERMIT access, not only on call sites -- the app
          # requests an empty HealthKit read set, but Runner.entitlements
          # declares com.apple.developer.healthkit, which permits read, so both
          # purpose strings are mandatory. Asserting them here fails the build
          # before upload instead of after Apple rejects it; a code comment
          # alone did not survive (the pre-#766 comment told the next editor to
          # remove the key).
          for key in NSHealthShareUsageDescription NSHealthUpdateUsageDescription; do
            value="$(plutil -extract "$key" raw -o - "$plist" 2>/dev/null || echo "MISSING")"
            if [ "$value" = "MISSING" ] || [ -z "$value" ]; then
              echo "::error::$key is missing from the exported Info.plist. It is required while Runner.entitlements declares com.apple.developer.healthkit (ITMS-90683, issue #766) -- an empty read: set does not exempt the bundle."
              exit 1
            fi
          done

          [ "$encryption" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption is '$encryption' in the exported Info.plist, expected false (see docs/ops/ios-export-compliance.md)"; exit 1; }

      - name: Set up sentry-cli (checksum-verified download)
        # U5 (R15/R16): warns and skips rather than failing the release when
        # the upload secrets are absent -- true for every build today, since
        # issue #19 has not provisioned them yet. sentry-cli is installed as
        # a pinned, checksum-verified release binary, never `curl | bash`
        # (KTD10): this step runs after the signing keychain and
        # provisioning profile are installed, so an unpinned remote script
        # here would run with the full signing credential set in reach. The
        # guard/download/verify logic is shared with play-store-release.yml
        # via upload-sentry-symbols-setup.sh (tested in CI's release-guards
        # jobs); only the download URL/checksum and the upload command
        # itself are platform-specific.
        #
        # No `continue-on-error` here (round 2 of issue #7's review; KTD10):
        # the script itself already warns-and-skips (exit 0) on a missing
        # secret or a download that fails after its own retries, so only a
        # genuine checksum mismatch -- a corrupted or tampered binary --
        # reaches a non-zero exit here, and that must fail the job loudly,
        # not be swallowed. `continue-on-error` is scoped to the next step,
        # which makes the actual Sentry upload network call.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_CLI_DOWNLOAD_URL: https://github.com/getsentry/sentry-cli/releases/download/3.7.0/sentry-cli-Darwin-universal
          SENTRY_CLI_SHA256: 10ccaaa39e6eee2b52034546f5f617533fdc76c64aa75c3038887045da1a367d
          SENTRY_CLI_CHECKSUM_TOOL: shasum
        run: bash .github/scripts/upload-sentry-symbols-setup.sh

      - name: Upload Sentry debug symbols (dSYMs)
        # continue-on-error (R15): once issue #19 provisions the secrets, a
        # Sentry-side outage on this upload call must degrade telemetry,
        # never block a signed TestFlight upload -- this is symbol upload,
        # not the release artifact itself. Scoped to just this network call,
        # not the checksum verification in the previous step (round 2 of
        # issue #7's review).
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -x ./sentry-cli ]; then
            # No --include-sources: this app's source files would upload to
            # a third party for no symbolication benefit (KTD10).
            ./sentry-cli debug-files upload build/ios/archive/Runner.xcarchive/dSYMs
          fi

      - name: Upload to TestFlight
        # Relies on API_PRIVATE_KEYS_DIR, exported to $GITHUB_ENV by
        # "Install the App Store Connect API key" above, to tell altool
        # where the .p8 key lives now that it's under $RUNNER_TEMP instead
        # of the default ~/.appstoreconnect/private_keys (issue #571).
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          QA_BUILD: ${{ inputs.qa_build }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -name '*.ipa' -maxdepth 1 | head -1)"
          [ -n "$ipa" ] || { echo "::error::no .ipa produced by the export step"; exit 1; }

          # Altool error 90592 ("Invalid Export Compliance Code") is an
          # operator-side App Store Connect filing issue, not a code bug
          # (see docs/ops/ios-export-compliance.md) -- point a failing run
          # at the runbook instead of leaving a bare altool exit code.
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" || {
            echo "::error::TestFlight upload failed (details above). If the error mentions 90592 / Invalid Export Compliance Code, see docs/ops/ios-export-compliance.md for the operator-side fix."
            exit 1
          }

          # Issue #739: altool cannot set TestFlight's "What to Test"
          # field, so the QA marking there is the one manual step in the
          # runbook (docs/ops/qa-builds.md): after processing finishes, set
          # it to text containing "QA build". The 501xxx build number and
          # the in-app QA banner are the automated markers.
          if [ "$QA_BUILD" = "true" ]; then
            echo "::notice::QA build uploaded (build ${{ steps.version.outputs.build }}). Once TestFlight finishes processing, set the build's 'What to Test' note to text containing 'QA build' per docs/ops/qa-builds.md."
          fi

      - name: Submit for App Store review
        if: steps.bump.outputs.submit == 'true' && steps.gate.outputs.gate_open != 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DELIVER_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          DELIVER_APP_VERSION: ${{ steps.version.outputs.marketing }}
          # Issue #571: without this, `bundle install` installs into the
          # runner user's global gem environment on this shared, persistent
          # Mac instead of a project-local directory.
          BUNDLE_PATH: vendor/bundle
        run: |
          set -euo pipefail
          # The root Gemfile/Gemfile.lock pin fastlane (issue #208) so the
          # runner's preinstalled fastlane cannot change deliver's behaviour
          # between releases.
          bundle install
          bundle exec fastlane ios submit

      - name: Clean up signing material and secrets
        # Issue #571: the ASC key now lives under $RUNNER_TEMP (see "Install
        # the App Store Connect API key" above), not $HOME, so cleanup no
        # longer touches -- let alone unconditionally `rm -rf`s -- anything
        # under the developer's own $HOME/.appstoreconnect. The provisioning
        # profiles installed above (app and widget extension) are removed by
        # their exact recorded paths instead of being left to accumulate in
        # $HOME/Library/MobileDevice/Provisioning Profiles across runs on
        # this non-ephemeral machine.
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${API_PRIVATE_KEYS_DIR:-}" ] && [ -d "$API_PRIVATE_KEYS_DIR" ]; then
            rm -rf "$API_PRIVATE_KEYS_DIR"
            echo "ASC API key removed."
          fi
          if [ -n "${PROVISIONING_PROFILE_PATH:-}" ] && [ -f "$PROVISIONING_PROFILE_PATH" ]; then
            rm -f "$PROVISIONING_PROFILE_PATH"
            echo "Provisioning profile removed ($PROVISIONING_PROFILE_PATH)."
          fi
          if [ -n "${WIDGET_PROVISIONING_PROFILE_PATH:-}" ] && [ -f "$WIDGET_PROVISIONING_PROFILE_PATH" ]; then
            rm -f "$WIDGET_PROVISIONING_PROFILE_PATH"
            echo "Widget provisioning profile removed ($WIDGET_PROVISIONING_PROFILE_PATH)."
          fi
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
            echo "Signing keychain removed."
          fi

      # Issue #573: this repo is public, and workflow-run artifacts on a
      # public repo are downloadable by anyone with no authentication. A
      # signed .ipa exposes the embedded provisioning profile (team ID, app
      # ID, entitlements) and the distribution cert's public half, and lets
      # anyone fetch the exact production build ahead of App Store review.
      # TestFlight is the system of record for this artifact; unlike
      # play-store-release.yml there is no non-production track here to
      # scope a restricted upload to, so the step is dropped rather than
      # narrowed.
