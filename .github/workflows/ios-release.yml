name: iOS Release

# Builds, signs, and ships an iOS build on every push to main.
#
# Mirrored from taxiGame.
#
# Two stages of delivery:
#   - Every push to main uploads a build to TestFlight.
#   - App Store review submission fires when the `version:` string in
#     pubspec.yaml changes anywhere across the pushed commit range (or when
#     manually dispatched with submit_for_review: true). See
#     .github/scripts/detect-version-bump.sh for the detection logic and
#     .github/scripts/check-release-gate.sh for the account-deletion gate
#     that can withhold submission (issue #17, issue #41).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID                    App Store Connect API key ID
#   ASC_ISSUER_ID                 App Store Connect API issuer ID
#   ASC_PRIVATE_KEY               Full contents of the AuthKey_<KEY_ID>.p8 file
#   IOS_DIST_CERT_P12_BASE64      base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD        password protecting that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision
#   SUPABASE_URL                  Supabase project URL (client-safe)
#   SUPABASE_ANON_KEY             Supabase publishable key (client-safe);
#                                 passed as SUPABASE_PUBLISHABLE_KEY
#   SENTRY_DSN                    Sentry DSN (client-safe; empty disables)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit the build for App Store review'
        type: boolean
        default: false

env:
  FLUTTER_CHANNEL: stable
  BUNDLE_ID: com.wjdavis5.lunarlog

concurrency:
  # Never let two releases upload builds at once — build numbers must be
  # strictly increasing and a race would burn one.
  group: ios-release
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  migration-gate:
    # Issue #47. A push to main uploads a client build to TestFlight, but
    # migrations are pushed by a *separate*, manually-gated workflow. Nothing
    # enforced the ordering, so the client could ship expecting a schema
    # production did not have yet -- which is exactly what happened on
    # 2026-09-05: two TestFlight builds carrying the multi-guardian sharing
    # feature went out roughly an hour before `profile_guardians` existed in
    # production.
    #
    # This job fails the release when any migration in the repo is not applied
    # to production. It fails closed on purpose: a blocked release is
    # recoverable, a client shipped against a missing schema is not.
    name: Verify Supabase migrations are applied
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The direct host (db.<ref>.supabase.co) publishes AAAA records only, and
      # GitHub-hosted runners have no IPv6 route -- it fails to resolve there.
      # Connect through the IPv4 session pooler instead. Override with the
      # repository variable if the project ever moves region.
      POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST || 'aws-0-us-west-2.pooler.supabase.com' }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check gate credentials
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set. This gate cannot verify that production has the migrations this build expects, so the release is blocked. Add it under Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "${PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_PROJECT_REF is not set. Add it under Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Install psql
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          psql --version

      - name: Compare repo migrations against production
        run: |
          set -euo pipefail

          repo=$(ls supabase/migrations/*.sql 2>/dev/null \
                 | xargs -n1 basename \
                 | sed -E 's/^([0-9]+)_.*/\1/' | sort -u)
          if [ -z "$repo" ]; then
            echo "::error::No migrations found in supabase/migrations. Refusing to release without verifying schema state."
            exit 1
          fi

          # Separate connection params rather than a URL: the password is not
          # URL-encoded anywhere, so a '@' or ':' in it cannot corrupt parsing.
          applied=$(psql -h "$POOLER_HOST" -p 5432 -U "postgres.${PROJECT_REF}" -d postgres \
                      -t -A -c "select version from supabase_migrations.schema_migrations" \
                    | tr -d '\r' | sed '/^$/d' | sort -u)

          missing=$(comm -23 <(echo "$repo") <(echo "$applied") || true)
          extra=$(comm -13 <(echo "$repo") <(echo "$applied") || true)

          echo "Repo migrations:      $(echo "$repo" | wc -l)"
          echo "Applied in production: $(echo "$applied" | sed '/^$/d' | wc -l)"

          if [ -n "$extra" ]; then
            # Not fatal: production having extra history does not mean this
            # client is ahead of its schema. It does mean the repo is not the
            # sole source of truth, which is worth surfacing.
            echo "::warning::Production has migration versions absent from this repo (applied outside the repo path): $(echo "$extra" | tr '\n' ' ')"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Release blocked -- production is missing $(echo "$missing" | wc -l) migration(s) this build expects: $(echo "$missing" | tr '\n' ' '). Run the 'Supabase migrate' workflow (or apply them manually), then re-run this release. Shipping now would put a client on TestFlight whose features fail against production."
            exit 1
          fi

          echo "All $(echo "$repo" | wc -l) repo migrations are applied to production. Safe to release."

  release-gate:
    # Fails fast, before any build work, when a dispatcher explicitly
    # requests submission (submit_for_review: true) while the
    # account-deletion release gate (issue #17) is closed. Deliberately has
    # no job-level `if:` -- a skipped `needs` job by default also skips its
    # dependent job, which would block every ordinary push to main. This
    # job always runs and always succeeds except in the one case it exists
    # to catch.
    name: Verify the release gate for explicit submission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip when not an explicit submission dispatch
        if: github.event_name != 'workflow_dispatch' || inputs.submit_for_review != true
        run: echo "Not an explicit submit_for_review dispatch; nothing to gate here."

      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.submit_for_review == true

      - name: Enforce the release gate
        if: github.event_name == 'workflow_dispatch' && inputs.submit_for_review == true
        env:
          RELEASE_GATE_ACCOUNT_DELETION: ${{ vars.RELEASE_GATE_ACCOUNT_DELETION }}
        run: bash .github/scripts/check-release-gate.sh

  release:
    name: Build, sign, and upload to TestFlight
    needs: [verify, migration-gate, release-gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Reading pubspec.yaml at an arbitrary before-commit (see the
          # `Detect a version bump` step below) needs full history --
          # fetch-depth: 2 only has the tip and its parent.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve build and version numbers
        id: version
        run: |
          set -euo pipefail

          marketing="$(bash .github/scripts/extract-marketing-version.sh < pubspec.yaml)"

          # Build number comes from monotonic run counter
          build_number=$(( ${{ github.run_number }} + 1000 ))

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $marketing ($build_number)"

      - name: Detect a version bump
        id: bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          CURRENT_VERSION: ${{ steps.version.outputs.marketing }}
        run: bash .github/scripts/detect-version-bump.sh

      - name: Check the release gate (warn-only)
        # A bump was detected, but the account-deletion release gate
        # (issue #17) governs whether it may actually submit. Closed here
        # degrades to a warning rather than failing the run -- TestFlight
        # delivery must not be denied for a policy reason.
        id: gate
        if: steps.bump.outputs.submit == 'true'
        env:
          RELEASE_GATE_ACCOUNT_DELETION: ${{ vars.RELEASE_GATE_ACCOUNT_DELETION }}
          RELEASE_GATE_MODE: warn
        run: bash .github/scripts/check-release-gate.sh

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Configure signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::Secret IOS_DIST_CERT_P12_BASE64 is empty or not configured."
            exit 1
          fi

          # Isolated keychain per run
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12
          rm -f "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "Imported identities:"
          security find-identity -v -p codesigning "$keychain"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_PROVISION_PROFILE_BASE64 is empty or not configured."
            exit 1
          fi

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"

          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          name="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Installed profile '$name' ($uuid)"

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
            ios/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter assets
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      - name: Install CocoaPods dependencies (if present)
        run: |
          if [ -f ios/Podfile ]; then
            cd ios && pod install && cd ..
          fi

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions-ci.plist \
            -exportPath build/ios/ipa

          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::export produced no .ipa"; exit 1; }

          workdir="$RUNNER_TEMP/ipa-verify"
          rm -rf "$workdir" && mkdir -p "$workdir"
          unzip -q "$ipa" -d "$workdir"
          app="$(ls -d "$workdir"/Payload/*.app)"

          authority="$(codesign -dvv "$app" 2>&1 | grep '^Authority=' | head -1)"
          echo "$authority"
          case "$authority" in
            *"Apple Distribution"*) ;;
            *) echo "::error::expected an Apple Distribution signature, got: $authority"; exit 1 ;;
          esac

      - name: Verify the exported bundle
        run: |
          set -euo pipefail
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          plist="$app/Info.plist"

          minimum="$(plutil -extract MinimumOSVersion raw -o - "$plist")"
          identifier="$(plutil -extract CFBundleIdentifier raw -o - "$plist")"

          echo "minimum OS: $minimum, bundle: $identifier"

          [ "$identifier" = "$BUNDLE_ID" ] || { echo "::error::bundle id is $identifier, expected $BUNDLE_ID"; exit 1; }
          awk -v v="$minimum" 'BEGIN { split(v, p, "."); if (p[1] < 15) { print "::error::MinimumOSVersion " v " is below the 15.0 Apple requires"; exit 1 } }'

          [ -f "$app/PrivacyInfo.xcprivacy" ] || { echo "::error::privacy manifest missing from the bundle"; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -name '*.ipa' -maxdepth 1 | head -1)"
          [ -n "$ipa" ] || { echo "::error::no .ipa produced by the export step"; exit 1; }

          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Submit for App Store review
        if: steps.bump.outputs.submit == 'true' && steps.gate.outputs.gate_open != 'false'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DELIVER_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          DELIVER_APP_VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          set -euo pipefail
          fastlane ios submit

      - name: Clean up signing material and secrets
        if: always()
        run: |
          set -euo pipefail
          rm -rf ~/.appstoreconnect/private_keys
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
            echo "Signing keychain removed."
          fi

      - name: Upload the IPA as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
