name: iOS Release

# Builds, signs, and ships an iOS build on every push to main.
#
# Mirrored from taxiGame.
#
# Two stages of delivery:
#   - Every push to main uploads a build to TestFlight.
#   - App Store review submission fires only when the `version:` string in
#     pubspec.yaml changes (or when manually dispatched with submit_for_review: true).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID                    App Store Connect API key ID
#   ASC_ISSUER_ID                 App Store Connect API issuer ID
#   ASC_PRIVATE_KEY               Full contents of the AuthKey_<KEY_ID>.p8 file
#   IOS_DIST_CERT_P12_BASE64      base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD        password protecting that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit the build for App Store review'
        type: boolean
        default: false

env:
  FLUTTER_CHANNEL: stable
  BUNDLE_ID: com.wjdavis5.lunarlog

concurrency:
  # Never let two releases upload builds at once — build numbers must be
  # strictly increasing and a race would burn one.
  group: ios-release
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: Build, sign, and upload to TestFlight
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve build and version numbers
        id: version
        run: |
          set -euo pipefail

          # pubspec version is "x.y.z+build"; marketing version is the part before '+'.
          marketing="$(grep '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d'+' -f1)"

          # Build number comes from monotonic run counter
          build_number=$(( ${{ github.run_number }} + 1000 ))

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $marketing ($build_number)"

      - name: Detect a version bump
        id: bump
        run: |
          set -euo pipefail

          current="${{ steps.version.outputs.marketing }}"

          if previous_raw="$(git show 'HEAD~1:pubspec.yaml' 2>/dev/null)"; then
            previous="$(printf '%s' "$previous_raw" | grep '^version:' | sed 's/^version: *//' | cut -d'+' -f1)"
          else
            previous="$current"
          fi

          manual="${{ inputs.submit_for_review }}"

          if [ "$manual" = "true" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
            echo "Submission requested manually via workflow_dispatch."
          elif [ "$current" != "$previous" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped ($previous -> $current); will submit for App Store review."
          else
            echo "submit=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($current); uploading to TestFlight only."
          fi

      - name: Configure signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$CERT_P12_BASE64" ]; then
            echo "::error::Secret IOS_DIST_CERT_P12_BASE64 is empty or not configured."
            exit 1
          fi

          # Isolated keychain per run
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12
          rm -f "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "Imported identities:"
          security find-identity -v -p codesigning "$keychain"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Secret IOS_PROVISION_PROFILE_BASE64 is empty or not configured."
            exit 1
          fi

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"

          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          name="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Installed profile '$name' ($uuid)"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter assets
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Install CocoaPods dependencies (if present)
        run: |
          if [ -f ios/Podfile ]; then
            cd ios && pod install && cd ..
          fi

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions-ci.plist \
            -exportPath build/ios/ipa

          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::export produced no .ipa"; exit 1; }

          workdir="$RUNNER_TEMP/ipa-verify"
          rm -rf "$workdir" && mkdir -p "$workdir"
          unzip -q "$ipa" -d "$workdir"
          app="$(ls -d "$workdir"/Payload/*.app)"

          authority="$(codesign -dvv "$app" 2>&1 | grep '^Authority=' | head -1)"
          echo "$authority"
          case "$authority" in
            *"Apple Distribution"*) ;;
            *) echo "::error::expected an Apple Distribution signature, got: $authority"; exit 1 ;;
          esac

      - name: Verify the exported bundle
        run: |
          set -euo pipefail
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          plist="$app/Info.plist"

          minimum="$(plutil -extract MinimumOSVersion raw -o - "$plist")"
          identifier="$(plutil -extract CFBundleIdentifier raw -o - "$plist")"

          echo "minimum OS: $minimum, bundle: $identifier"

          [ "$identifier" = "$BUNDLE_ID" ] || { echo "::error::bundle id is $identifier, expected $BUNDLE_ID"; exit 1; }
          awk -v v="$minimum" 'BEGIN { split(v, p, "."); if (p[1] < 15) { print "::error::MinimumOSVersion " v " is below the 15.0 Apple requires"; exit 1 } }'

          [ -f "$app/PrivacyInfo.xcprivacy" ] || { echo "::error::privacy manifest missing from the bundle"; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -name '*.ipa' -maxdepth 1 | head -1)"
          [ -n "$ipa" ] || { echo "::error::no .ipa produced by the export step"; exit 1; }

          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Submit for App Store review
        if: steps.bump.outputs.submit == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DELIVER_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          DELIVER_APP_VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          set -euo pipefail
          fastlane ios submit

      - name: Remove the signing keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
            echo "Signing keychain removed."
          fi

      - name: Upload the IPA as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14
