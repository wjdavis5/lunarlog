# U7: JVM TLS 1.3 downloads from dl.google.com fail with (bad_record_mac)
# Tag mismatch on this host; TLS 1.2 avoids the corrupted-record path.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
